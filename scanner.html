<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#E30613">
  <title>Scanner - WMS Makro 156</title>

  <!-- ZXing เป็น fallback (ถ้าไม่มี BarcodeDetector) -->
  <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>

  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{
      width:100%;height:100%;overflow:hidden;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Sarabun","Noto Sans Thai",sans-serif;
      background:#000;color:#fff;
      -webkit-user-select:none;user-select:none;
    }
    .scanner-wrap{position:fixed;inset:0;display:flex;flex-direction:column;background:#000}

    /* ===== Header ===== */
    .scanner-header{
      background:linear-gradient(135deg,#E30613,#B00410);
      padding:12px 16px;
      display:flex;justify-content:space-between;align-items:center;
      box-shadow:0 4px 20px rgba(227,6,19,.4);
      z-index:10;flex-shrink:0;
    }
    .scanner-header h1{
      font-size:15px;font-weight:900;letter-spacing:.3px;
      display:flex;align-items:center;gap:8px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .scanner-header .close-btn{
      width:36px;height:36px;border-radius:50%;
      background:rgba(255,255,255,.2);color:#fff;
      display:grid;place-items:center;font-size:18px;
      border:none;cursor:pointer;font-weight:900;flex-shrink:0;
      margin-left:8px;
    }
    .scanner-header .close-btn:active{transform:scale(.92)}

    /* ===== Viewport ===== */
    .scanner-viewport{
      position:relative;flex:1;background:#000;
      overflow:hidden;
      display:flex;align-items:center;justify-content:center;
    }
    .scanner-viewport video{
      width:100%;height:100%;
      object-fit:cover;display:block;
      background:#000;
    }

    /* ===== Overlay ===== */
    .scanner-overlay{
      position:absolute;inset:0;
      display:grid;place-items:center;
      pointer-events:none;z-index:5;
    }
    .scanner-frame{
      width:82%;max-width:320px;
      aspect-ratio:1.5/1;
      border:3px solid rgba(255,255,255,.95);
      border-radius:16px;
      box-shadow:0 0 0 9999px rgba(0,0,0,.6);
      position:relative;
      animation:framePulse 1.8s ease-in-out infinite;
    }
    @keyframes framePulse{
      0%,100%{
        border-color:rgba(255,255,255,.95);
        box-shadow:0 0 0 9999px rgba(0,0,0,.6),0 0 0 0 rgba(0,230,118,.6);
      }
      50%{
        border-color:rgba(0,230,118,1);
        box-shadow:0 0 0 9999px rgba(0,0,0,.6),0 0 0 14px rgba(0,230,118,0);
      }
    }
    .scanner-frame::before,
    .scanner-frame::after{
      content:'';position:absolute;
      width:38px;height:38px;
      border:4px solid #00E676;border-radius:8px;
    }
    .scanner-frame::before{top:-4px;left:-4px;border-right:none;border-bottom:none}
    .scanner-frame::after{bottom:-4px;right:-4px;border-left:none;border-top:none}

    /* Laser */
    .scanner-laser{
      position:absolute;
      left:9%;right:9%;
      height:2.5px;
      background:linear-gradient(90deg,transparent,#00E676,transparent);
      box-shadow:0 0 14px #00E676;
      border-radius:2px;
      top:9%;
      animation:laserScan 1.6s ease-in-out infinite;
    }
    @keyframes laserScan{
      0%,100%{top:9%}
      50%{top:calc(91% - 3px)}
    }

    /* Flash effect when success */
    .flash-success{
      position:absolute;inset:0;
      background:rgba(0,230,118,.45);
      z-index:50;pointer-events:none;
      animation:flash .35s ease-out;
    }
    @keyframes flash{
      0%{opacity:0}
      40%{opacity:1}
      100%{opacity:0}
    }

    /* Loading */
    .scanner-loading{
      position:absolute;inset:0;
      display:grid;place-items:center;
      background:rgba(0,0,0,.85);
      z-index:20;text-align:center;padding:24px;
    }
    .spinner{
      width:52px;height:52px;
      border:4px solid rgba(255,255,255,.15);
      border-top-color:#E30613;
      border-right-color:#FF4D57;
      border-radius:50%;
      animation:spin .9s linear infinite;
      margin:0 auto 14px;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-text{font-size:13px;font-weight:700;color:rgba(255,255,255,.85);margin-top:6px}

    /* Status */
    .scanner-status{
      padding:10px 16px;
      background:rgba(0,0,0,.95);
      text-align:center;
      font-size:12.5px;font-weight:700;
      color:rgba(255,255,255,.9);
      border-top:1px solid rgba(255,255,255,.1);
      flex-shrink:0;
      display:flex;align-items:center;justify-content:center;gap:8px;
      min-height:40px;
    }
    .scanner-status .dot{
      width:8px;height:8px;border-radius:50%;
      background:#00E676;box-shadow:0 0 10px #00E676;
      animation:dotPulse 1.2s infinite;flex-shrink:0;
    }
    @keyframes dotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}

    /* Controls */
    .scanner-controls{
      display:flex;gap:8px;
      padding:10px 14px 14px;
      background:#000;flex-shrink:0;
      flex-wrap:wrap;
    }
    .ctrl-btn{
      flex:1;min-width:80px;min-height:46px;
      border-radius:12px;
      font-weight:800;font-size:12.5px;
      border:1.5px solid rgba(255,255,255,.25);
      background:rgba(255,255,255,.12);color:#fff;
      cursor:pointer;
      display:flex;align-items:center;justify-content:center;gap:6px;
      transition:.15s;
    }
    .ctrl-btn:active{transform:scale(.95);background:rgba(255,255,255,.25)}
    .ctrl-btn.primary{
      background:linear-gradient(135deg,#E30613,#B00410);
      border-color:transparent;
      box-shadow:0 4px 14px rgba(227,6,19,.35);
    }

    /* Result Popup */
    .result-popup{
      position:fixed;inset:0;
      background:rgba(0,0,0,.88);
      display:grid;place-items:center;
      padding:20px;z-index:100;
      animation:fadeIn .18s;
    }
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .result-card{
      background:#fff;color:#000;
      border-radius:20px;
      width:100%;max-width:420px;
      padding:24px 22px;
      text-align:center;
      box-shadow:0 24px 60px rgba(0,0,0,.5);
      animation:popIn .3s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
    .result-icon{font-size:52px;margin-bottom:10px;display:block}
    .result-title{font-size:15px;font-weight:900;color:#00A651;margin-bottom:12px}
    .result-code{
      font-family:'Courier New',monospace;
      font-size:17px;font-weight:900;color:#E30613;
      background:#F5F5F5;padding:14px 16px;
      border-radius:12px;word-break:break-all;
      margin-bottom:14px;
      border:2px dashed #E30613;
      min-height:52px;
      display:flex;align-items:center;justify-content:center;
    }
    .result-info{font-size:11.5px;color:#666;margin-bottom:14px;line-height:1.5}
    .result-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .result-btn{
      padding:14px;border-radius:12px;border:none;
      font-weight:900;font-size:14px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;gap:6px;
      transition:.15s;
    }
    .result-btn:active{transform:scale(.96)}
    .result-btn.rescan{background:#F5F5F5;color:#333}
    .result-btn.confirm{
      background:linear-gradient(135deg,#00A651,#008a43);
      color:#fff;box-shadow:0 4px 14px rgba(0,166,81,.35);
    }

    /* Manual Input */
    .manual-popup{
      position:fixed;inset:0;
      background:rgba(0,0,0,.88);
      display:grid;place-items:center;
      padding:20px;z-index:110;
    }
    .manual-card{
      background:#fff;color:#000;
      border-radius:20px;width:100%;max-width:420px;
      padding:24px 22px;
    }
    .manual-card h3{font-size:16px;font-weight:900;margin-bottom:14px;color:#E30613}
    .manual-input{
      width:100%;padding:14px 16px;
      border:2px solid #E8E8E8;border-radius:12px;
      font-size:16px;font-family:monospace;font-weight:700;
      outline:none;margin-bottom:12px;
    }
    .manual-input:focus{border-color:#E30613}

    /* Toast */
    .toast-stack{
      position:fixed;top:70px;right:14px;
      display:flex;flex-direction:column;gap:8px;
      z-index:200;max-width:calc(100vw - 28px);
      pointer-events:none;
    }
    .toast{
      background:#333;color:#fff;
      padding:11px 16px;border-radius:12px;
      font-weight:700;font-size:12.5px;
      box-shadow:0 8px 24px rgba(0,0,0,.4);
      animation:slideIn .25s;pointer-events:auto;
      border-left:4px solid #666;
      max-width:320px;word-break:break-word;
    }
    .toast.success{background:#00A651;border-left-color:#4ADE80}
    .toast.error{background:#DC2626;border-left-color:#F87171}
    .toast.warn{background:#FF9500;border-left-color:#FCD34D}
    .toast.info{background:#0EA5E9;border-left-color:#38BDF8}
    @keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:none;opacity:1}}

    .hidden{display:none!important}

    /* Landscape */
    @media (orientation:landscape) and (max-height:500px){
      .scanner-header{padding:8px 14px}
      .scanner-header h1{font-size:13px}
      .scanner-controls{padding:6px 12px 8px}
      .ctrl-btn{min-height:38px;font-size:11.5px;padding:6px}
      .scanner-status{padding:6px 14px;font-size:11.5px;min-height:32px}
      .scanner-frame{max-width:240px}
    }
  </style>
</head>
<body>

<div class="scanner-wrap">

  <div class="scanner-header">
    <h1>📷 <span id="headerTitle">สแกนบาร์โค้ด / QR</span></h1>
    <button class="close-btn" onclick="closeAndReturn()" title="ปิด">✕</button>
  </div>

  <div class="scanner-viewport">
    <video id="video" autoplay playsinline muted></video>

    <div class="scanner-overlay">
      <div class="scanner-frame"></div>
      <div class="scanner-laser"></div>
    </div>

    <div class="scanner-loading" id="loading">
      <div>
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">กำลังเปิดกล้อง...</div>
      </div>
    </div>
  </div>

  <div class="scanner-status">
    <span class="dot"></span>
    <span id="statusText">กำลังเริ่ม...</span>
  </div>

  <div class="scanner-controls">
    <button class="ctrl-btn" id="torchBtn" onclick="toggleTorch()" style="display:none">🔆 เปิดไฟ</button>
    <button class="ctrl-btn" id="switchBtn" onclick="switchCamera()" style="display:none">🔄 สลับ</button>
    <button class="ctrl-btn" onclick="openManualInput()">⌨️ กรอกเอง</button>
    <button class="ctrl-btn primary" onclick="closeAndReturn()">✕ ปิด</button>
  </div>
</div>

<!-- Result -->
<div class="result-popup hidden" id="resultPopup">
  <div class="result-card">
    <span class="result-icon" id="resultIcon">✅</span>
    <div class="result-title" id="resultTitle">สแกนสำเร็จ</div>
    <div class="result-code" id="resultCode">—</div>
    <div class="result-info" id="resultInfo">ตรวจสอบรหัสก่อนยืนยัน</div>
    <div class="result-actions">
      <button class="result-btn rescan" onclick="rescan()">🔄 สแกนใหม่</button>
      <button class="result-btn confirm" onclick="confirmAndReturn()">✅ ยืนยัน</button>
    </div>
  </div>
</div>

<!-- Manual -->
<div class="manual-popup hidden" id="manualPopup">
  <div class="manual-card">
    <h3>⌨️ กรอกเอง</h3>
    <input type="text" class="manual-input" id="manualInput"
           placeholder="พิมพ์บาร์โค้ด / รหัส..."
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <div class="result-actions">
      <button class="result-btn rescan" onclick="closeManual()">ยกเลิก</button>
      <button class="result-btn confirm" onclick="submitManual()">ตกลง</button>
    </div>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script>
'use strict';

/* ============================================================
   📋 CONFIG
============================================================ */
var config = {
  returnUrl: '',
  scanMode: 'text',
  label: 'สแกนบาร์โค้ด / QR'
};

/* ============================================================
   📦 STATE
============================================================ */
var state = {
  // Video
  stream: null,
  videoTrack: null,
  video: null,

  // Engines
  detector: null,           // BarcodeDetector
  zxingReader: null,        // ZXing fallback
  activeEngine: null,       // 'native' | 'zxing'

  // Scanning control
  isScanning: false,
  rafId: null,
  lastDecodeTime: 0,
  decodeInterval: 60,       // ms between decodes (60ms ≈ 16fps decode)

  // Result
  lastResult: '',
  lastResultTime: 0,
  pendingResult: '',
  debounceMs: 1200,

  // Camera
  devices: [],
  currentDeviceIndex: 0,
  currentFacing: 'environment',
  torchOn: false,
  torchAvailable: false,

  // UI
  flashTimer: null
};

/* ============================================================
   🎯 INIT
============================================================ */
window.addEventListener('load', function() {
  var params = new URLSearchParams(location.search);
  config.returnUrl = params.get('returnUrl') || params.get('ret') || '';
  config.scanMode = params.get('mode') || 'text';
  config.label = params.get('label') || 'สแกนบาร์โค้ด / QR';

  document.getElementById('headerTitle').textContent = config.label;

  updateStatusForMode();

  // ตรวจ In-App Browser
  if (detectInAppBrowser()) return;

  // ตรวจ HTTPS
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
    showError('⚠️ ต้องใช้ HTTPS', 'เว็บนี้ต้องเปิดผ่าน https://');
    return;
  }

  // ตรวจ API
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showError('เบราว์เซอร์ไม่รองรับกล้อง', 'ใช้ Chrome (Android) หรือ Safari (iOS)');
    return;
  }

  // เริ่ม
  initCamera();
});

function updateStatusForMode() {
  var el = document.getElementById('statusText');
  if (config.scanMode === 'item') el.textContent = '📦 เล็งบาร์โค้ดสินค้า';
  else if (config.scanMode === 'pallet') el.textContent = '🚚 เล็ง QR Code พาเลท';
  else el.textContent = 'เล็งกล้องไปที่บาร์โค้ดหรือ QR Code';
}

function detectInAppBrowser() {
  var ua = navigator.userAgent || '';
  var isLine = /Line\//i.test(ua);
  var isFacebook = /FBAN|FBAV|FB_IAB|FB4A|FBIOS/i.test(ua);
  var isInstagram = /Instagram/i.test(ua);
  var isTikTok = /TikTok|BytedanceWebview/i.test(ua);
  var isTwitter = /Twitter/i.test(ua);

  if (isLine || isFacebook || isInstagram || isTikTok || isTwitter) {
    var app = isLine ? 'LINE' : isFacebook ? 'Facebook' : isInstagram ? 'Instagram' : isTikTok ? 'TikTok' : 'Twitter';
    showError(
      '⚠️ ต้องเปิดใน Chrome / Safari',
      'คุณกำลังเปิดจาก ' + app + '<br><br>' +
      '<b style="color:#FFB800">วิธีแก้:</b><br>' +
      'กด ⋮ (มุมขวาบน) → เปิดในเบราว์เซอร์'
    );
    return true;
  }
  return false;
}

/* ============================================================
   📷 เปิดกล้อง — บังคับกล้องหลัง
============================================================ */
function initCamera() {
  state.video = document.getElementById('video');

  // ✅ Step 1: ขอสิทธิ์ + เปิดกล้องหลังทันที (ใช้ facingMode exact)
  requestCamera({ facingMode: { exact: 'environment' } }, true)
    .catch(function(err) {
      console.warn('exact environment fail:', err.name);
      // Fallback 1: ideal environment
      return requestCamera({ facingMode: { ideal: 'environment' } }, false);
    })
    .catch(function(err) {
      console.warn('ideal environment fail:', err.name);
      // Fallback 2: ใช้ deviceId ที่หาได้
      return tryDeviceIdCamera();
    })
    .catch(function(err) {
      console.error('All camera attempts failed:', err);
      handleCameraError(err);
    });
}

function requestCamera(constraints, isExact) {
  var videoConstraints = {
    width: { ideal: 1280, min: 640 },
    height: { ideal: 720, min: 480 },
    frameRate: { ideal: 30, min: 15 }
  };

  // Merge constraints
  if (constraints.facingMode) {
    videoConstraints.facingMode = constraints.facingMode;
  }
  if (constraints.deviceId) {
    videoConstraints.deviceId = constraints.deviceId;
  }

  var fullConstraints = {
    audio: false,
    video: videoConstraints
  };

  return navigator.mediaDevices.getUserMedia(fullConstraints)
    .then(function(stream) {
      return setupStream(stream);
    });
}

function tryDeviceIdCamera() {
  return navigator.mediaDevices.enumerateDevices()
    .then(function(devices) {
      state.devices = devices.filter(function(d) { return d.kind === 'videoinput'; });
      if (state.devices.length === 0) {
        return Promise.reject(new Error('No camera devices'));
      }

      // หากล้องหลังจาก label
      var backCam = findBackCamera(state.devices);
      if (!backCam) backCam = state.devices[state.devices.length - 1]; // ตัวสุดท้ายมักเป็นกล้องหลัง

      var idx = state.devices.indexOf(backCam);
      state.currentDeviceIndex = idx >= 0 ? idx : 0;

      return requestCamera({ deviceId: { exact: backCam.deviceId } }, false);
    });
}

function findBackCamera(devices) {
  var keywords = ['back', 'rear', 'environment', 'หลัง', 'primary', 'world', 'main'];
  for (var i = 0; i < devices.length; i++) {
    var label = (devices[i].label || '').toLowerCase();
    for (var k = 0; k < keywords.length; k++) {
      if (label.indexOf(keywords[k]) !== -1) return devices[i];
    }
  }
  return null;
}

/* ============================================================
   🎬 Setup stream
============================================================ */
function setupStream(stream) {
  return new Promise(function(resolve, reject) {
    state.stream = stream;
    state.videoTrack = stream.getVideoTracks()[0];

    if (!state.videoTrack) {
      reject(new Error('No video track'));
      return;
    }

    var video = state.video;
    video.srcObject = stream;
    video.setAttribute('playsinline', 'true');
    video.setAttribute('webkit-playsinline', 'true');
    video.setAttribute('muted', 'true');
    video.muted = true;

    // รอ video พร้อม
    var onReady = function() {
      video.removeEventListener('loadedmetadata', onReady);

      // ✅ บังคับ continuous focus + torch
      applyTrackSettings()
        .then(function() {
          document.getElementById('loading').classList.add('hidden');

          // เริ่ม engine
          startEngine();

          // โหลดรายการกล้อง (สำหรับปุ่มสลับ)
          loadCameraList();

          // Log
          logCameraInfo();

          resolve();
        })
        .catch(function(err) {
          console.warn('applyTrackSettings error:', err);
          // ยังคงสแกนได้
          document.getElementById('loading').classList.add('hidden');
          startEngine();
          loadCameraList();
          resolve();
        });
    };

    video.addEventListener('loadedmetadata', onReady);

    video.play().catch(function(e) {
      console.warn('play() error:', e);
    });

    // Timeout fallback
    setTimeout(function() {
      if (!state.isScanning && video.readyState >= 2) {
        onReady();
      }
    }, 2000);
  });
}

function applyTrackSettings() {
  return new Promise(function(resolve) {
    if (!state.videoTrack) { resolve(); return; }

    var caps = state.videoTrack.getCapabilities ? state.videoTrack.getCapabilities() : {};
    var advanced = [];

    // ✅ Continuous focus
    if (caps.focusMode && caps.focusMode.indexOf('continuous') !== -1) {
      advanced.push({ focusMode: 'continuous' });
    }

    // ✅ Torch available?
    if (caps.torch) {
      state.torchAvailable = true;
      document.getElementById('torchBtn').style.display = 'flex';
    }

    // ✅ Zoom (บางกล้อง)
    if (caps.zoom && caps.zoom.min !== undefined && caps.zoom.max !== undefined) {
      var midZoom = (caps.zoom.min + caps.zoom.max) / 2;
      // ใช้ zoom ปานกลางเพื่อโฟกัส
      // advanced.push({ zoom: midZoom });
    }

    if (advanced.length === 0) {
      resolve();
      return;
    }

    state.videoTrack.applyConstraints({ advanced: advanced })
      .then(function() { resolve(); })
      .catch(function(e) {
        console.warn('applyConstraints error:', e);
        resolve();
      });
  });
}

function loadCameraList() {
  navigator.mediaDevices.enumerateDevices()
    .then(function(devices) {
      state.devices = devices.filter(function(d) { return d.kind === 'videoinput'; });
      if (state.devices.length > 1) {
        document.getElementById('switchBtn').style.display = 'flex';
      }
    })
    .catch(function(e) { console.warn('enumerateDevices:', e); });
}

function logCameraInfo() {
  try {
    var settings = state.videoTrack.getSettings ? state.videoTrack.getSettings() : {};
    console.log('📷 Camera:', {
      deviceId: settings.deviceId ? settings.deviceId.substring(0, 12) + '...' : 'n/a',
      resolution: settings.width + 'x' + settings.height,
      frameRate: settings.frameRate,
      facingMode: settings.facingMode,
      focusMode: settings.focusMode,
      torch: state.torchAvailable
    });
  } catch(e) {}
}

/* ============================================================
   🚀 เริ่มสแกน Engine
============================================================ */
function startEngine() {
  state.isScanning = true;

  // ✅ Priority 1: BarcodeDetector native (เร็วที่สุด)
  if ('BarcodeDetector' in window) {
    tryInitNativeDetector();
    return;
  }

  // ✅ Priority 2: ZXing fallback
  if (typeof ZXing !== 'undefined') {
    initZXing();
    return;
  }

  showError('ไม่พบตัวสแกน', 'เบราว์เซอร์ไม่รองรับ — กรุณาใช้ Chrome ล่าสุด');
}

/* ============================================================
   ⚡ BarcodeDetector Native (เร็วที่สุด)
============================================================ */
function tryInitNativeDetector() {
  // ลอง format sets หลายแบบ
  var formatSets = [
    ['qr_code', 'ean_13', 'ean_8', 'code_128', 'code_39', 'code_93', 'upc_a', 'upc_e', 'itf', 'codabar', 'data_matrix', 'pdf417'],
    ['qr_code', 'ean_13', 'ean_8', 'code_128', 'code_39', 'upc_a', 'upc_e', 'itf'],
    ['qr_code', 'ean_13', 'code_128'],
    undefined
  ];

  var idx = 0;
  function tryNext() {
    if (idx >= formatSets.length) {
      console.warn('BarcodeDetector ไม่สามารถ init ได้ → ใช้ ZXing');
      if (typeof ZXing !== 'undefined') initZXing();
      else showError('ไม่พบตัวสแกน', '');
      return;
    }

    var formats = formatSets[idx++];
    var detector;
    try {
      detector = formats ? new BarcodeDetector({ formats: formats }) : new BarcodeDetector();
    } catch(e) {
      tryNext();
      return;
    }

    // ทดสอบด้วย frame ปัจจุบัน
    detector.detect(state.video)
      .then(function() {
        // ✅ ใช้ได้
        state.detector = detector;
        state.activeEngine = 'native';
        console.log('✅ BarcodeDetector ready:', formats || 'default');
        document.getElementById('statusText').textContent = '⚡ โหมดเร็ว (Native) — เล็งบาร์โค้ด';
        startNativeLoop();
      })
      .catch(function(err) {
        console.warn('BarcodeDetector test fail:', err);
        tryNext();
      });
  }
  tryNext();
}

function startNativeLoop() {
  var loop = function() {
    if (!state.isScanning || !state.detector) return;

    var now = performance.now();
    if (now - state.lastDecodeTime >= state.decodeInterval) {
      state.lastDecodeTime = now;

      // ✅ สแกนเฟรมปัจจุบัน
      state.detector.detect(state.video)
        .then(function(barcodes) {
          if (!state.isScanning) return;
          if (barcodes && barcodes.length > 0) {
            // ✅ เอาเฉพาะอันแรกที่มี rawValue
            for (var i = 0; i < barcodes.length; i++) {
              if (barcodes[i] && barcodes[i].rawValue) {
                onScanned(barcodes[i].rawValue, barcodes[i].format);
                break;
              }
            }
          }
        })
        .catch(function(err) {
          // ignore — decode fail ปกติ
        });
    }

    state.rafId = requestAnimationFrame(loop);
  };
  loop();
}

/* ============================================================
   🔧 ZXing Fallback
============================================================ */
function initZXing() {
  if (typeof ZXing === 'undefined') {
    showError('ไม่พบ ZXing', '');
    return;
  }

  try {
    var hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
      ZXing.BarcodeFormat.QR_CODE,
      ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.CODE_93,
      ZXing.BarcodeFormat.UPC_A,
      ZXing.BarcodeFormat.UPC_E,
      ZXing.BarcodeFormat.ITF,
      ZXing.BarcodeFormat.CODABAR
    ]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    hints.set(ZXing.DecodeHintType.CHARACTER_SET, 'UTF-8');

    var reader = new ZXing.BrowserMultiFormatReader(hints);
    state.zxingReader = reader;
    state.activeEngine = 'zxing';

    document.getElementById('statusText').textContent = '📷 เล็งบาร์โค้ดให้เต็มกรอบ';

    reader.decodeFromVideoDevice(null, 'video', function(result, err) {
      if (!state.isScanning) return;
      if (result) {
        onScanned(result.getText(), 'zxing');
      }
    });
  } catch(e) {
    console.error('ZXing init error:', e);
    showError('ตัวสแกนขัดข้อง', String(e.message || e));
  }
}

/* ============================================================
   🎯 สแกนสำเร็จ
============================================================ */
function onScanned(text, format) {
  if (!text) return;

  var now = Date.now();
  if (text === state.lastResult && (now - state.lastResultTime) < state.debounceMs) return;

  state.lastResult = text;
  state.lastResultTime = now;
  state.pendingResult = text;

  // หยุดสแกนชั่วคราว
  state.isScanning = false;

  // Feedback
  beepSuccess();
  haptic([50, 40, 50]);
  showSuccessFlash();

  // แสดง popup
  setTimeout(function() {
    showResultPopup(text, format);
  }, 150);
}

/* ============================================================
   💬 Result Popup
============================================================ */
function showResultPopup(code, format) {
  document.getElementById('resultCode').textContent = code;

  var formatText = format ? String(format).toUpperCase() : '';
  document.getElementById('resultInfo').textContent = formatText
    ? 'รูปแบบ: ' + formatText + ' · ตรวจสอบก่อนยืนยัน'
    : 'ตรวจสอบรหัสก่อนยืนยัน';

  document.getElementById('resultIcon').textContent = '✅';
  document.getElementById('resultTitle').textContent = 'สแกนสำเร็จ';
  document.getElementById('resultPopup').classList.remove('hidden');
}

function rescan() {
  state.pendingResult = '';
  document.getElementById('resultPopup').classList.add('hidden');

  setTimeout(function() {
    state.lastResult = '';
    state.lastResultTime = 0;
    state.isScanning = true;
    state.lastDecodeTime = 0;
  }, 300);
}

function confirmAndReturn() {
  if (!state.pendingResult) {
    toast('ไม่มีค่าที่สแกนได้', 'warn');
    return;
  }
  returnToApp(state.pendingResult);
}

/* ============================================================
   🚀 ส่งค่ากลับ
============================================================ */
function returnToApp(code) {
  if (!code) return;

  beepSuccess();
  haptic([50, 40, 50]);

  stopAll();

  if (!config.returnUrl) {
    document.getElementById('resultCode').textContent = code;
    document.getElementById('resultInfo').textContent = 'กรุณาก็อปโค้ดด้านบนไปวางใน WMS';
    document.getElementById('resultIcon').textContent = '📋';
    document.getElementById('resultTitle').textContent = 'ก็อปโค้ดไปวาง';
    return;
  }

  var url = config.returnUrl;
  var sep = url.indexOf('?') === -1 ? '?' : '&';
  var finalUrl = url + sep + 'scanresult=' + encodeURIComponent(code) +
                 '#scanresult=' + encodeURIComponent(code);

  document.getElementById('resultIcon').textContent = '🚀';
  document.getElementById('resultTitle').textContent = 'กำลังกลับไปที่ WMS...';

  setTimeout(function() {
    try {
      window.location.href = finalUrl;
    } catch(e) {
      window.location.assign(finalUrl);
    }
  }, 350);
}

function closeAndReturn() {
  stopAll();
  if (config.returnUrl) {
    try { window.location.href = config.returnUrl; }
    catch(e) { window.history.back(); }
  } else {
    window.close();
  }
}

function stopAll() {
  state.isScanning = false;

  // หยุด RAF
  if (state.rafId) {
    cancelAnimationFrame(state.rafId);
    state.rafId = null;
  }

  // หยุด ZXing
  if (state.zxingReader) {
    try { state.zxingReader.reset(); } catch(e) {}
    state.zxingReader = null;
  }

  // หยุด detector
  state.detector = null;

  // หยุดกล้อง
  if (state.stream) {
    try {
      state.stream.getTracks().forEach(function(t) { t.stop(); });
    } catch(e) {}
    state.stream = null;
  }

  state.videoTrack = null;

  if (state.video) {
    try { state.video.srcObject = null; } catch(e) {}
  }
}

/* ============================================================
   🔆 Torch / 🔄 Switch
============================================================ */
function toggleTorch() {
  if (!state.videoTrack || !state.torchAvailable) {
    toast('อุปกรณ์ไม่รองรับไฟ', 'warn');
    return;
  }

  state.torchOn = !state.torchOn;

  state.videoTrack.applyConstraints({
    advanced: [{ torch: state.torchOn }]
  }).then(function() {
    document.getElementById('torchBtn').textContent = state.torchOn ? '🔅 ปิดไฟ' : '🔆 เปิดไฟ';
  }).catch(function(e) {
    console.warn('torch error:', e);
    toast('เปิดไฟไม่สำเร็จ', 'warn');
    state.torchOn = !state.torchOn; // revert
  });
}

function switchCamera() {
  if (state.devices.length < 2) return;

  // หยุดของเดิม
  stopAll();

  state.currentDeviceIndex = (state.currentDeviceIndex + 1) % state.devices.length;
  var nextDevice = state.devices[state.currentDeviceIndex];

  // แสดง loading
  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('loadingText').textContent = 'กำลังสลับกล้อง...';

  // เปิดกล้องใหม่
  setTimeout(function() {
    requestCamera({ deviceId: { exact: nextDevice.deviceId } }, false)
      .then(function() {
        toast('สลับกล้องแล้ว', 'info', 1200);
      })
      .catch(function(e) {
        console.error('switch fail:', e);
        toast('สลับกล้องไม่สำเร็จ', 'error');
        document.getElementById('loading').classList.add('hidden');
      });
  }, 200);
}

/* ============================================================
   ⌨️ Manual
============================================================ */
function openManualInput() {
  document.getElementById('manualInput').value = '';
  document.getElementById('manualPopup').classList.remove('hidden');
  setTimeout(function() {
    document.getElementById('manualInput').focus();
  }, 200);
}

function closeManual() {
  document.getElementById('manualPopup').classList.add('hidden');
}

function submitManual() {
  var val = document.getElementById('manualInput').value.trim();
  if (!val) {
    toast('กรุณากรอกค่า', 'warn');
    return;
  }
  closeManual();
  state.pendingResult = val;
  returnToApp(val);
}

/* ============================================================
   🎨 UI Helper
============================================================ */
function showSuccessFlash() {
  var viewport = document.querySelector('.scanner-viewport');
  if (!viewport) return;

  var old = viewport.querySelector('.flash-success');
  if (old) old.remove();

  var flash = document.createElement('div');
  flash.className = 'flash-success';
  viewport.appendChild(flash);

  clearTimeout(state.flashTimer);
  state.flashTimer = setTimeout(function() {
    if (flash.parentNode) flash.remove();
  }, 400);
}

function showError(msg, hint) {
  document.getElementById('loading').innerHTML =
    '<div style="padding:24px;text-align:center">' +
    '<div style="font-size:56px;margin-bottom:12px">🚫</div>' +
    '<div style="font-weight:900;font-size:16px;margin-bottom:8px;color:#fff">' + msg + '</div>' +
    '<div style="font-size:12px;color:rgba(255,255,255,.7);line-height:1.7;margin-bottom:20px">' + hint + '</div>' +
    '<button class="ctrl-btn primary" onclick="openManualInput()" ' +
    'style="width:100%;max-width:240px;margin:0 auto;padding:14px">' +
    '⌨️ กรอกเอง' +
    '</button>' +
    '</div>';
  document.getElementById('loading').classList.remove('hidden');
}

function handleCameraError(err) {
  var name = (err && err.name) || '';
  var msg = (err && err.message) || 'Unknown error';

  if (name === 'NotAllowedError' || name === 'SecurityError') {
    showError(
      '🚫 กล้องถูกบล็อก',
      '<b style="color:#FFB800">แก้ไข:</b><br>' +
      '1. กด 🔒 ที่ address bar<br>' +
      '2. เลือก "การตั้งค่าเว็บไซต์"<br>' +
      '3. Camera → อนุญาต<br>' +
      '4. รีเฟรชหน้า'
    );
  } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
    showError('ไม่พบกล้อง', 'อุปกรณ์นี้ไม่มีกล้อง');
  } else if (name === 'NotReadableError') {
    showError('กล้องถูกใช้งานอยู่', 'ปิดแอปอื่นที่ใช้กล้อง (Facebook, LINE, กล้อง)');
  } else if (name === 'AbortError') {
    showError('กล้องขัดข้อง', 'ลองรีเฟรชหน้า');
  } else {
    showError('ไม่สามารถเปิดกล้องได้', msg);
  }
}

function toast(msg, type, duration) {
  type = type || 'info';
  duration = duration || 2200;
  var stack = document.getElementById('toastStack');
  if (!stack) return;

  var el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  stack.appendChild(el);

  setTimeout(function() {
    el.style.transition = 'opacity .25s, transform .25s';
    el.style.opacity = '0';
    el.style.transform = 'translateX(120%)';
    setTimeout(function() {
      if (el.parentNode) el.remove();
    }, 250);
  }, duration);
}

function haptic(p) {
  if (navigator.vibrate) {
    try { navigator.vibrate(p || 10); } catch(e) {}
  }
}

function beepSuccess() {
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    var ctx = new AC();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.value = 1500;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.15);

    // Cleanup context
    setTimeout(function() {
      try { ctx.close(); } catch(e) {}
    }, 500);
  } catch(e) {}
}

/* ============================================================
   🧹 Cleanup
============================================================ */
window.addEventListener('beforeunload', function() {
  stopAll();
});

window.addEventListener('pagehide', function() {
  stopAll();
});

document.addEventListener('visibilitychange', function() {
  if (document.hidden) {
    // พักสแกน
    if (state.isScanning) {
      state.isScanning = false;
    }
  } else {
    // กลับมา → สแกนต่อ
    if (!state.pendingResult && state.detector) {
      state.isScanning = true;
      state.lastDecodeTime = 0;
    }
  }
});

/* ============================================================
   ⌨️ Manual input Enter
============================================================ */
document.addEventListener('DOMContentLoaded', function() {
  var mi = document.getElementById('manualInput');
  if (mi) {
    mi.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitManual();
      }
    });
  }
});
</script>
