<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#E30613">
  <title>Scanner - WMS Makro 156</title>

  <!-- ZXing Library (ตัวสแกน) -->
  <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>

  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{
      width:100%;height:100%;overflow:hidden;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Sarabun","Noto Sans Thai",sans-serif;
      background:#000;color:#fff;
    }

    /* ===== Layout ===== */
    .scanner-wrap{
      position:fixed;inset:0;
      display:flex;flex-direction:column;
      background:#000;
    }

    /* ===== Header ===== */
    .scanner-header{
      background:linear-gradient(135deg,#E30613,#B00410);
      padding:14px 18px;
      display:flex;justify-content:space-between;align-items:center;
      box-shadow:0 4px 20px rgba(227,6,19,.4);
      z-index:10;flex-shrink:0;
    }
    .scanner-header h1{
      font-size:16px;font-weight:900;letter-spacing:.3px;
      display:flex;align-items:center;gap:8px;
    }
    .scanner-header .close-btn{
      width:36px;height:36px;border-radius:50%;
      background:rgba(255,255,255,.2);color:#fff;
      display:grid;place-items:center;font-size:18px;
      border:none;cursor:pointer;font-weight:900;
    }
    .scanner-header .close-btn:hover{background:rgba(255,255,255,.35)}

    /* ===== Viewport ===== */
    .scanner-viewport{
      position:relative;
      flex:1;
      background:#000;
      overflow:hidden;
    }
    .scanner-viewport video{
      width:100%;height:100%;
      object-fit:cover;display:block;
      background:#000;
    }

    /* ===== Overlay Frame ===== */
    .scanner-overlay{
      position:absolute;inset:0;
      display:grid;place-items:center;
      pointer-events:none;
    }
    .scanner-frame{
      width:78%;max-width:340px;
      aspect-ratio:1/1;
      border:3px solid rgba(255,255,255,.95);
      border-radius:20px;
      box-shadow:0 0 0 9999px rgba(0,0,0,.6);
      position:relative;
      animation:framePulse 2s ease-in-out infinite;
    }
    @keyframes framePulse{
      0%,100%{border-color:rgba(255,255,255,.95);box-shadow:0 0 0 9999px rgba(0,0,0,.6),0 0 0 0 rgba(227,6,19,.6)}
      50%{border-color:rgba(227,6,19,1);box-shadow:0 0 0 9999px rgba(0,0,0,.6),0 0 0 14px rgba(227,6,19,0)}
    }
    .scanner-frame::before,
    .scanner-frame::after{
      content:'';position:absolute;
      width:36px;height:36px;
      border:4px solid #E30613;border-radius:8px;
    }
    .scanner-frame::before{top:-4px;left:-4px;border-right:none;border-bottom:none}
    .scanner-frame::after{bottom:-4px;right:-4px;border-left:none;border-top:none}

    /* ===== Laser Line ===== */
    .scanner-laser{
      position:absolute;
      left:11%;right:11%;
      height:3px;
      background:linear-gradient(90deg,transparent,#E30613,transparent);
      box-shadow:0 0 14px #E30613;
      border-radius:2px;
      top:11%;
      animation:laserScan 2.2s ease-in-out infinite;
    }
    @keyframes laserScan{
      0%,100%{top:11%}
      50%{top:calc(89% - 3px)}
    }

    /* ===== Loading ===== */
    .scanner-loading{
      position:absolute;inset:0;
      display:grid;place-items:center;
      background:rgba(0,0,0,.85);
      z-index:20;
      text-align:center;padding:24px;
    }
    .spinner{
      width:56px;height:56px;
      border:4px solid rgba(255,255,255,.15);
      border-top-color:#E30613;
      border-right-color:#FF4D57;
      border-radius:50%;
      animation:spin 1s linear infinite;
      margin:0 auto 16px;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-text{
      font-size:14px;font-weight:700;color:rgba(255,255,255,.85);
      margin-top:8px;
    }

    /* ===== Status Bar ===== */
    .scanner-status{
      padding:12px 18px;
      background:rgba(0,0,0,.95);
      text-align:center;
      font-size:13px;font-weight:700;
      color:rgba(255,255,255,.9);
      border-top:1px solid rgba(255,255,255,.1);
      flex-shrink:0;
      display:flex;align-items:center;justify-content:center;gap:8px;
    }
    .scanner-status .dot{
      width:8px;height:8px;border-radius:50%;
      background:#00A651;box-shadow:0 0 8px #00A651;
      animation:dotPulse 1.5s infinite;
    }
    @keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.4}}

    /* ===== Controls ===== */
    .scanner-controls{
      display:flex;gap:8px;
      padding:12px 16px 16px;
      background:#000;
      flex-shrink:0;
      flex-wrap:wrap;
    }
    .ctrl-btn{
      flex:1;min-width:90px;min-height:48px;
      border-radius:12px;
      font-weight:800;font-size:13px;
      border:1.5px solid rgba(255,255,255,.25);
      background:rgba(255,255,255,.12);color:#fff;
      cursor:pointer;
      display:flex;align-items:center;justify-content:center;gap:6px;
      transition:.2s;
    }
    .ctrl-btn:hover{background:rgba(255,255,255,.25)}
    .ctrl-btn:active{transform:scale(.96)}
    .ctrl-btn.primary{
      background:linear-gradient(135deg,#E30613,#B00410);
      border-color:transparent;
      box-shadow:0 4px 14px rgba(227,6,19,.35);
    }

    /* ===== Result Popup ===== */
    .result-popup{
      position:fixed;inset:0;
      background:rgba(0,0,0,.85);
      display:grid;place-items:center;
      padding:20px;z-index:100;
      animation:fadeIn .2s;
    }
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .result-card{
      background:#fff;color:#000;
      border-radius:20px;
      width:100%;max-width:420px;
      padding:24px 22px;
      text-align:center;
      box-shadow:0 24px 60px rgba(0,0,0,.5);
      animation:popIn .3s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
    .result-icon{
      font-size:52px;margin-bottom:10px;
      display:block;
    }
    .result-title{
      font-size:15px;font-weight:900;
      color:#00A651;margin-bottom:12px;
    }
    .result-code{
      font-family:'Courier New',monospace;
      font-size:18px;font-weight:900;
      color:#E30613;
      background:#F5F5F5;
      padding:14px 16px;
      border-radius:12px;
      word-break:break-all;
      margin-bottom:16px;
      border:2px dashed #E30613;
      min-height:52px;
      display:flex;align-items:center;justify-content:center;
    }
    .result-info{
      font-size:11.5px;color:#666;
      margin-bottom:14px;line-height:1.5;
    }
    .result-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
    .result-btn{
      padding:14px;
      border-radius:12px;
      border:none;
      font-weight:900;
      font-size:14px;
      cursor:pointer;
      display:flex;align-items:center;justify-content:center;gap:6px;
      transition:.2s;
    }
    .result-btn.rescan{
      background:#F5F5F5;color:#333;
    }
    .result-btn.rescan:hover{background:#E8E8E8}
    .result-btn.confirm{
      background:linear-gradient(135deg,#00A651,#008a43);
      color:#fff;
      box-shadow:0 4px 14px rgba(0,166,81,.35);
    }
    .result-btn.confirm:hover{transform:translateY(-1px)}
    .result-btn.full{grid-column:1 / -1}

    /* ===== Manual Input ===== */
    .manual-popup{
      position:fixed;inset:0;
      background:rgba(0,0,0,.85);
      display:grid;place-items:center;
      padding:20px;z-index:110;
    }
    .manual-card{
      background:#fff;color:#000;
      border-radius:20px;width:100%;max-width:420px;
      padding:24px 22px;
    }
    .manual-card h3{
      font-size:16px;font-weight:900;margin-bottom:14px;
      color:#E30613;
    }
    .manual-input{
      width:100%;padding:14px 16px;
      border:2px solid #E8E8E8;border-radius:12px;
      font-size:16px;font-family:monospace;font-weight:700;
      outline:none;margin-bottom:12px;
    }
    .manual-input:focus{border-color:#E30613}

    /* ===== Toast ===== */
    .toast-stack{
      position:fixed;top:80px;right:16px;
      display:flex;flex-direction:column;gap:8px;
      z-index:200;max-width:calc(100vw - 32px);
      pointer-events:none;
    }
    .toast{
      background:#333;color:#fff;
      padding:12px 18px;border-radius:12px;
      font-weight:700;font-size:13px;
      box-shadow:0 8px 24px rgba(0,0,0,.4);
      animation:slideIn .3s;
      pointer-events:auto;
      border-left:4px solid #666;
      max-width:340px;word-break:break-word;
    }
    .toast.success{background:#00A651;border-left-color:#4ADE80}
    .toast.error{background:#DC2626;border-left-color:#F87171}
    .toast.warn{background:#FF9500;border-left-color:#FCD34D}
    .toast.info{background:#0EA5E9;border-left-color:#38BDF8}
    @keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:none;opacity:1}}

    /* ===== Hidden ===== */
    .hidden{display:none!important}

    /* ===== Responsive ===== */
    @media (max-width:400px){
      .scanner-frame{width:82%}
      .scanner-header h1{font-size:14px}
      .ctrl-btn{min-width:80px;font-size:12px;padding:10px 8px}
    }
  </style>
</head>
<body>

<div class="scanner-wrap">

  <!-- Header -->
  <div class="scanner-header">
    <h1>📷 <span id="headerTitle">สแกนบาร์โค้ด / QR</span></h1>
    <button class="close-btn" onclick="closeAndReturn()" title="ปิด">✕</button>
  </div>

  <!-- Viewport -->
  <div class="scanner-viewport">
    <video id="video" autoplay playsinline muted></video>

    <div class="scanner-overlay">
      <div class="scanner-frame"></div>
      <div class="scanner-laser"></div>
    </div>

    <div class="scanner-loading" id="loading">
      <div>
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">กำลังเปิดกล้อง...</div>
      </div>
    </div>
  </div>

  <!-- Status -->
  <div class="scanner-status">
    <span class="dot"></span>
    <span id="statusText">เล็งกล้องไปที่บาร์โค้ดหรือ QR Code</span>
  </div>

  <!-- Controls -->
  <div class="scanner-controls">
    <button class="ctrl-btn" id="torchBtn" onclick="toggleTorch()" style="display:none">🔆 เปิดไฟ</button>
    <button class="ctrl-btn" id="switchBtn" onclick="switchCamera()" style="display:none">🔄 สลับกล้อง</button>
    <button class="ctrl-btn" onclick="openManualInput()">⌨️ กรอกเอง</button>
    <button class="ctrl-btn primary" onclick="closeAndReturn()">✕ ปิด</button>
  </div>
</div>

<!-- Result Popup -->
<div class="result-popup hidden" id="resultPopup">
  <div class="result-card">
    <span class="result-icon" id="resultIcon">✅</span>
    <div class="result-title" id="resultTitle">สแกนสำเร็จ</div>
    <div class="result-code" id="resultCode">—</div>
    <div class="result-info" id="resultInfo">ตรวจสอบรหัสก่อนยืนยัน</div>
    <div class="result-actions">
      <button class="result-btn rescan" onclick="rescan()">🔄 สแกนใหม่</button>
      <button class="result-btn confirm" onclick="confirmAndReturn()">✅ ยืนยัน</button>
    </div>
  </div>
</div>

<!-- Manual Input -->
<div class="manual-popup hidden" id="manualPopup">
  <div class="manual-card">
    <h3>⌨️ กรอกเอง</h3>
    <input type="text" class="manual-input" id="manualInput"
           placeholder="พิมพ์บาร์โค้ด / รหัส..."
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <div class="result-actions">
      <button class="result-btn rescan" onclick="closeManual()">ยกเลิก</button>
      <button class="result-btn confirm" onclick="submitManual()">ตกลง</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast-stack" id="toastStack"></div>

<script>
'use strict';

/* ============================================================
   📋 CONFIG
============================================================ */
var config = {
  returnUrl: '',
  scanMode: 'text',
  label: 'สแกนบาร์โค้ด / QR',
  headerColor: '#E30613'
};

/* ============================================================
   📦 STATE
============================================================ */
var state = {
  codeReader: null,
  stream: null,
  videoTrack: null,
  torchOn: false,
  lastResult: '',
  lastResultTime: 0,
  devices: [],
  currentDeviceIndex: 0,
  scanning: false,
  pendingResult: ''
};

/* ============================================================
   🎯 INIT
============================================================ */
window.addEventListener('load', function() {
  // อ่าน parameters จาก URL
  var params = new URLSearchParams(location.search);
  config.returnUrl = params.get('returnUrl') || params.get('ret') || '';
  config.scanMode = params.get('mode') || 'text';
  config.label = params.get('label') || 'สแกนบาร์โค้ด / QR';

  // ปรับ UI
  document.getElementById('headerTitle').textContent = config.label;

  if (config.scanMode === 'item') {
    document.getElementById('statusText').textContent = '📦 เล็งบาร์โค้ดสินค้า';
  } else if (config.scanMode === 'pallet') {
    document.getElementById('statusText').textContent = '🚚 เล็ง QR Code พาเลท';
  }

  // ถ้าไม่มี returnUrl → แสดงข้อความเตือน
  if (!config.returnUrl) {
    document.getElementById('loadingText').textContent = 'ไม่พบ returnUrl — จะแสดงค่าที่สแกน';
    console.warn('⚠️ ไม่มี returnUrl — จะไม่สามารถส่งค่ากลับได้');
  }

  startCamera();
});

/* ============================================================
   📷 เปิดกล้อง + สแกน
============================================================ */
function startCamera() {
  var video = document.getElementById('video');

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showCameraError('เบราว์เซอร์ไม่รองรับกล้อง', 'กรุณาใช้ Chrome / Safari');
    return;
  }

  // ลอง constraint หลายแบบ
  var attempts = [
    { audio:false, video:{ facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720} } },
    { audio:false, video:{ facingMode:'environment' } },
    { audio:false, video:true }
  ];

  var idx = 0;
  function tryNext() {
    if (idx >= attempts.length) {
      showCameraError('ไม่สามารถเปิดกล้องได้', 'กรุณาอนุญาตการใช้กล้อง');
      return;
    }
    var c = attempts[idx++];
    navigator.mediaDevices.getUserMedia(c)
      .then(function(stream) {
        state.stream = stream;
        video.srcObject = stream;
        video.setAttribute('playsinline', 'true');
        video.setAttribute('muted', 'true');
        video.play().catch(function(){});

        state.videoTrack = stream.getVideoTracks()[0];

        // ตรวจสอบ capabilities
        var caps = state.videoTrack.getCapabilities ? state.videoTrack.getCapabilities() : {};
        if (caps && caps.torch) {
          document.getElementById('torchBtn').style.display = 'flex';
        }

        // ตรวจสอบกล้องหลายตัว
        navigator.mediaDevices.enumerateDevices().then(function(devices) {
          state.devices = devices.filter(function(d) { return d.kind === 'videoinput'; });
          if (state.devices.length > 1) {
            document.getElementById('switchBtn').style.display = 'flex';
          }
        }).catch(function(){});

        document.getElementById('loading').classList.add('hidden');
        startZXing(video);
        toast('กล้องพร้อมแล้ว', 'success', 1500);
      })
      .catch(function(err) {
        console.warn('Camera error:', err);
        tryNext();
      });
  }
  tryNext();
}

function startZXing(video) {
  if (typeof ZXing === 'undefined') {
    showCameraError('ไม่พบ ZXing library', 'กรุณารีเฟรชหน้า');
    return;
  }

  try {
    var hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
      ZXing.BarcodeFormat.QR_CODE,
      ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.CODE_93,
      ZXing.BarcodeFormat.UPC_A,
      ZXing.BarcodeFormat.UPC_E,
      ZXing.BarcodeFormat.ITF,
      ZXing.BarcodeFormat.CODABAR,
      ZXing.BarcodeFormat.DATA_MATRIX,
      ZXing.BarcodeFormat.PDF_417
    ]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    hints.set(ZXing.DecodeHintType.CHARACTER_SET, 'UTF-8');

    var reader = new ZXing.BrowserMultiFormatReader(hints);
    state.codeReader = reader;
    state.scanning = true;

    reader.decodeFromVideoDevice(null, 'video', function(result, err) {
      if (!state.scanning) return;
      if (result) {
        onScanned(result.getText());
      }
    });
  } catch (e) {
    console.error('ZXing error:', e);
    showCameraError('ตัวสแกนขัดข้อง', e.message);
  }
}

/* ============================================================
   🎯 เมื่อสแกนได้
============================================================ */
function onScanned(text) {
  if (!text) return;
  var now = Date.now();
  // กันสแกนซ้ำใน 1.5 วินาที
  if (text === state.lastResult && (now - state.lastResultTime) < 1500) return;
  state.lastResult = text;
  state.lastResultTime = now;

  beep('success');
  haptic([30, 40, 30]);

  state.pendingResult = text;
  showResultPopup(text);
}

/* ============================================================
   💬 Result Popup
============================================================ */
function showResultPopup(code) {
  document.getElementById('resultCode').textContent = code;
  document.getElementById('resultInfo').textContent = 'ตรวจสอบรหัสก่อนยืนยัน';
  document.getElementById('resultIcon').textContent = '✅';
  document.getElementById('resultTitle').textContent = 'สแกนสำเร็จ';
  document.getElementById('resultPopup').classList.remove('hidden');
}

function rescan() {
  state.pendingResult = '';
  document.getElementById('resultPopup').classList.add('hidden');
  // รอ 1.5 วิ ก่อนเริ่มสแกนใหม่ (กันการสแกนซ้ำ)
  setTimeout(function() {
    state.lastResult = '';
    state.lastResultTime = 0;
  }, 1500);
}

function confirmAndReturn() {
  if (!state.pendingResult) {
    toast('ไม่มีค่าที่สแกนได้', 'warn');
    return;
  }
  returnToApp(state.pendingResult);
}

/* ============================================================
   🚀 ส่งค่ากลับ Apps Script
============================================================ */
function returnToApp(code) {
  if (!code) return;

  beep('success');
  haptic([50, 30, 50]);

  // ถ้าไม่มี returnUrl → แสดงโค้ดแทน
  if (!config.returnUrl) {
    document.getElementById('resultCode').textContent = code;
    document.getElementById('resultInfo').textContent =
      'กรุณาก็อปโค้ดด้านบนไปวางใน WMS';
    document.getElementById('resultIcon').textContent = '📋';
    document.getElementById('resultTitle').textContent = 'ก็อปโค้ดไปวาง';
    return;
  }

  // สร้าง URL กลับ
  var url = config.returnUrl;
  var sep = url.indexOf('?') === -1 ? '?' : '&';
  var finalUrl = url + sep + 'scanresult=' + encodeURIComponent(code) + '#scanresult=' + encodeURIComponent(code);

  document.getElementById('resultIcon').textContent = '🚀';
  document.getElementById('resultTitle').textContent = 'กำลังกลับไปที่ WMS...';

  setTimeout(function() {
    try {
      window.location.href = finalUrl;
    } catch (e) {
      console.error('Redirect error:', e);
      // fallback: เปิดในหน้าต่างเดิม
      window.location.assign(finalUrl);
    }
  }, 300);
}

function closeAndReturn() {
  if (config.returnUrl) {
    // กลับโดยไม่มีค่า
    try {
      window.location.href = config.returnUrl;
    } catch (e) {
      window.history.back();
    }
  } else {
    window.close();
  }
}

/* ============================================================
   ⌨️ Manual Input
============================================================ */
function openManualInput() {
  document.getElementById('manualInput').value = '';
  document.getElementById('manualPopup').classList.remove('hidden');
  setTimeout(function() {
    document.getElementById('manualInput').focus();
  }, 200);
}

function closeManual() {
  document.getElementById('manualPopup').classList.add('hidden');
}

function submitManual() {
  var val = document.getElementById('manualInput').value.trim();
  if (!val) {
    toast('กรุณากรอกค่า', 'warn');
    return;
  }
  closeManual();
  state.pendingResult = val;
  returnToApp(val);
}

/* ============================================================
   🔆 Torch / Switch Camera
============================================================ */
function toggleTorch() {
  if (!state.videoTrack) return;
  var caps = state.videoTrack.getCapabilities ? state.videoTrack.getCapabilities() : {};
  if (!caps || !caps.torch) {
    toast('อุปกรณ์ไม่รองรับไฟ', 'warn');
    return;
  }
  state.torchOn = !state.torchOn;
  state.videoTrack.applyConstraints({
    advanced: [{ torch: state.torchOn }]
  }).then(function() {
    document.getElementById('torchBtn').textContent = state.torchOn ? '🔅 ปิดไฟ' : '🔆 เปิดไฟ';
  }).catch(function() {
    toast('เปิดไฟไม่สำเร็จ', 'warn');
  });
}

function switchCamera() {
  if (state.devices.length < 2) return;
  state.currentDeviceIndex = (state.currentDeviceIndex + 1) % state.devices.length;
  var device = state.devices[state.currentDeviceIndex];

  // หยุดของเดิม
  if (state.codeReader) { try { state.codeReader.reset(); } catch(e){} }
  if (state.stream) {
    state.stream.getTracks().forEach(function(t){ t.stop(); });
  }

  navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{ deviceId:{ exact:device.deviceId }, width:{ideal:1280}, height:{ideal:720} }
  }).then(function(stream) {
    state.stream = stream;
    var video = document.getElementById('video');
    video.srcObject = stream;
    video.play().catch(function(){});
    state.videoTrack = stream.getVideoTracks()[0];

    var caps = state.videoTrack.getCapabilities ? state.videoTrack.getCapabilities() : {};
    document.getElementById('torchBtn').style.display = (caps && caps.torch) ? 'flex' : 'none';

    startZXing(video);
    toast('สลับกล้องแล้ว', 'info', 1500);
  }).catch(function(err) {
    console.error(err);
    toast('สลับกล้องไม่สำเร็จ', 'error');
  });
}

function showCameraError(msg, hint) {
  document.getElementById('loading').innerHTML =
    '<div style="padding:24px;text-align:center">' +
    '<div style="font-size:56px;margin-bottom:12px">🚫</div>' +
    '<div style="font-weight:900;font-size:16px;margin-bottom:8px">' + msg + '</div>' +
    '<div style="font-size:12px;color:rgba(255,255,255,.7);line-height:1.6;margin-bottom:20px">' + hint + '</div>' +
    '<button class="ctrl-btn primary" onclick="openManualInput()" ' +
    'style="width:100%;max-width:240px;margin:0 auto;padding:14px">' +
    '⌨️ กรอกเอง' +
    '</button>' +
    '</div>';
}

function toast(msg, type, duration) {
  type = type || 'info';
  duration = duration || 2500;
  var stack = document.getElementById('toastStack');
  var el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  stack.appendChild(el);
  setTimeout(function() {
    el.style.transition = 'opacity .3s, transform .3s';
    el.style.opacity = '0';
    el.style.transform = 'translateX(120%)';
    setTimeout(function() { el.remove(); }, 300);
  }, duration);
}

function haptic(p) { if (navigator.vibrate) navigator.vibrate(p || 10); }

function beep(type) {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = type === 'success' ? 880 : 400;
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    osc.start();
    osc.stop(ctx.currentTime + 0.15);
  } catch(e) {}
}

/* ============================================================
   🧹 Cleanup เมื่อปิดหน้า
============================================================ */
window.addEventListener('beforeunload', function() {
  if (state.codeReader) { try { state.codeReader.reset(); } catch(e){} }
  if (state.stream) {
    state.stream.getTracks().forEach(function(t){ t.stop(); });
  }
});

// Keyboard Enter สำหรับ manual
document.addEventListener('DOMContentLoaded', function() {
  var mi = document.getElementById('manualInput');
  if (mi) {
    mi.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); submitManual(); }
    });
  }
});
</script>
