<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#E30613">
  <title>Scanner Pro - WMS Makro 156</title>

  <!-- ZXing เป็น fallback -->
  <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>

  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{
      width:100%;height:100%;overflow:hidden;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Sarabun","Noto Sans Thai",sans-serif;
      background:#000;color:#fff;
      -webkit-user-select:none;user-select:none;
      touch-action:manipulation;
    }
    .wrap{position:fixed;inset:0;display:flex;flex-direction:column;background:#000}

    /* Header */
    .header{
      background:linear-gradient(135deg,#E30613,#B00410);
      padding:12px 16px;
      display:flex;justify-content:space-between;align-items:center;
      box-shadow:0 4px 20px rgba(227,6,19,.4);
      z-index:10;flex-shrink:0;
    }
    .header h1{
      font-size:15px;font-weight:900;
      display:flex;align-items:center;gap:8px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .close-x{
      width:36px;height:36px;border-radius:50%;
      background:rgba(255,255,255,.2);color:#fff;
      display:grid;place-items:center;font-size:18px;
      border:none;cursor:pointer;font-weight:900;flex-shrink:0;
      margin-left:8px;
    }
    .close-x:active{transform:scale(.92)}

    /* Viewport */
    .vp{
      position:relative;flex:1;
      background:#000;overflow:hidden;
      display:flex;align-items:center;justify-content:center;
    }
    .vp video{
      width:100%;height:100%;
      object-fit:cover;display:block;
      background:#000;
    }

    /* Overlay */
    .ov{
      position:absolute;inset:0;
      display:grid;place-items:center;
      pointer-events:none;z-index:5;
    }
    .frame{
      width:88%;max-width:340px;
      aspect-ratio:1.5/1;
      border:3px solid rgba(255,255,255,.95);
      border-radius:16px;
      box-shadow:0 0 0 9999px rgba(0,0,0,.55);
      position:relative;
      animation:fp 1.6s ease-in-out infinite;
      transition:border-color .2s;
    }
    @keyframes fp{
      0%,100%{
        border-color:rgba(255,255,255,.95);
        box-shadow:0 0 0 9999px rgba(0,0,0,.55),0 0 0 0 rgba(0,230,118,.7);
      }
      50%{
        border-color:rgba(0,230,118,1);
        box-shadow:0 0 0 9999px rgba(0,0,0,.55),0 0 0 16px rgba(0,230,118,0);
      }
    }
    .frame.detected{
      border-color:#00E676 !important;
      animation:none;
      box-shadow:0 0 0 9999px rgba(0,0,0,.55), 0 0 0 6px rgba(0,230,118,.4);
    }
    .frame::before,
    .frame::after{
      content:'';position:absolute;
      width:40px;height:40px;
      border:4px solid #00E676;border-radius:8px;
    }
    .frame::before{top:-4px;left:-4px;border-right:none;border-bottom:none}
    .frame::after{bottom:-4px;right:-4px;border-left:none;border-top:none}

    /* Laser */
    .laser{
      position:absolute;
      left:7%;right:7%;
      height:2.5px;
      background:linear-gradient(90deg,transparent,#00E676,transparent);
      box-shadow:0 0 14px #00E676;
      border-radius:2px;
      top:7%;
      animation:ls 1.4s ease-in-out infinite;
    }
    @keyframes ls{
      0%,100%{top:7%}
      50%{top:calc(93% - 3px)}
    }

    /* FPS indicator */
    .fps-indicator{
      position:absolute;top:14px;right:14px;
      background:rgba(0,0,0,.7);
      padding:4px 10px;
      border-radius:8px;
      font-family:'Courier New',monospace;
      font-size:10px;font-weight:900;
      color:#00E676;
      z-index:15;
      border:1px solid rgba(0,230,118,.3);
    }

    /* Flash */
    .flash{
      position:absolute;inset:0;
      background:rgba(0,230,118,.5);
      z-index:50;pointer-events:none;
      animation:fl .3s ease-out;
    }
    @keyframes fl{0%{opacity:0}40%{opacity:1}100%{opacity:0}}

    /* Loading */
    .load{
      position:absolute;inset:0;
      display:grid;place-items:center;
      background:rgba(0,0,0,.85);
      z-index:20;text-align:center;padding:24px;
    }
    .spin{
      width:52px;height:52px;
      border:4px solid rgba(255,255,255,.15);
      border-top-color:#E30613;
      border-right-color:#FF4D57;
      border-radius:50%;
      animation:sp .9s linear infinite;
      margin:0 auto 14px;
    }
    @keyframes sp{to{transform:rotate(360deg)}}
    .load-text{font-size:13px;font-weight:700;color:rgba(255,255,255,.85);margin-top:6px}

    /* Status */
    .stat{
      padding:10px 16px;
      background:rgba(0,0,0,.95);
      text-align:center;
      font-size:12.5px;font-weight:700;
      color:rgba(255,255,255,.9);
      border-top:1px solid rgba(255,255,255,.1);
      flex-shrink:0;
      display:flex;align-items:center;justify-content:center;gap:8px;
      min-height:40px;
    }
    .stat .dot{
      width:8px;height:8px;border-radius:50%;
      background:#00E676;box-shadow:0 0 10px #00E676;
      animation:dp 1.2s infinite;flex-shrink:0;
    }
    @keyframes dp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}

    /* Controls */
    .ctrls{
      display:flex;gap:8px;
      padding:10px 14px 14px;
      background:#000;flex-shrink:0;
      flex-wrap:wrap;
    }
    .btn{
      flex:1;min-width:80px;min-height:46px;
      border-radius:12px;
      font-weight:800;font-size:12.5px;
      border:1.5px solid rgba(255,255,255,.25);
      background:rgba(255,255,255,.12);color:#fff;
      cursor:pointer;
      display:flex;align-items:center;justify-content:center;gap:6px;
      transition:.15s;
    }
    .btn:active{transform:scale(.95);background:rgba(255,255,255,.25)}
    .btn.red{
      background:linear-gradient(135deg,#E30613,#B00410);
      border-color:transparent;
      box-shadow:0 4px 14px rgba(227,6,19,.35);
    }
    .btn.green{
      background:linear-gradient(135deg,#00E676,#00A651);
      border-color:transparent;
      box-shadow:0 4px 14px rgba(0,230,118,.35);
    }

    /* Result Popup */
    .popup{
      position:fixed;inset:0;
      background:rgba(0,0,0,.88);
      display:grid;place-items:center;
      padding:20px;z-index:100;
      animation:fi .18s;
    }
    @keyframes fi{from{opacity:0}to{opacity:1}}
    .popup-card{
      background:#fff;color:#000;
      border-radius:20px;
      width:100%;max-width:420px;
      padding:24px 22px;
      text-align:center;
      box-shadow:0 24px 60px rgba(0,0,0,.5);
      animation:pi .3s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes pi{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
    .popup-icon{font-size:52px;margin-bottom:10px;display:block}
    .popup-title{font-size:15px;font-weight:900;color:#00A651;margin-bottom:12px}
    .popup-code{
      font-family:'Courier New',monospace;
      font-size:17px;font-weight:900;color:#E30613;
      background:#F5F5F5;padding:14px 16px;
      border-radius:12px;word-break:break-all;
      margin-bottom:14px;
      border:2px dashed #E30613;
      min-height:52px;
      display:flex;align-items:center;justify-content:center;
    }
    .popup-info{font-size:11.5px;color:#666;margin-bottom:14px;line-height:1.5}
    .popup-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .pbtn{
      padding:14px;border-radius:12px;border:none;
      font-weight:900;font-size:14px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;gap:6px;
      transition:.15s;
    }
    .pbtn:active{transform:scale(.96)}
    .pbtn.grey{background:#F5F5F5;color:#333}
    .pbtn.green{
      background:linear-gradient(135deg,#00A651,#008a43);
      color:#fff;box-shadow:0 4px 14px rgba(0,166,81,.35);
    }

    /* Manual */
    .manual-input{
      width:100%;padding:14px 16px;
      border:2px solid #E8E8E8;border-radius:12px;
      font-size:16px;font-family:monospace;font-weight:700;
      outline:none;margin-bottom:12px;
      -webkit-user-select:text;user-select:text;
    }
    .manual-input:focus{border-color:#E30613}

    /* Toast */
    .toast-stack{
      position:fixed;top:70px;right:14px;
      display:flex;flex-direction:column;gap:8px;
      z-index:200;max-width:calc(100vw - 28px);
      pointer-events:none;
    }
    .toast{
      background:#333;color:#fff;
      padding:11px 16px;border-radius:12px;
      font-weight:700;font-size:12.5px;
      box-shadow:0 8px 24px rgba(0,0,0,.4);
      animation:si .25s;pointer-events:auto;
      border-left:4px solid #666;
      max-width:320px;word-break:break-word;
    }
    .toast.success{background:#00A651;border-left-color:#4ADE80}
    .toast.error{background:#DC2626;border-left-color:#F87171}
    .toast.warn{background:#FF9500;border-left-color:#FCD34D}
    .toast.info{background:#0EA5E9;border-left-color:#38BDF8}
    @keyframes si{from{transform:translateX(120%);opacity:0}to{transform:none;opacity:1}}

    .hidden{display:none!important}
  </style>
</head>
<body>

<div class="wrap">

  <div class="header">
    <h1>📷 <span id="headerTitle">สแกนบาร์โค้ด / QR</span></h1>
    <button class="close-x" onclick="closeAndReturn()">✕</button>
  </div>

  <div class="vp">
    <video id="video" autoplay playsinline muted></video>

    <div class="ov">
      <div class="frame" id="scanFrame"></div>
      <div class="laser" id="scanLaser"></div>
    </div>

    <div class="fps-indicator" id="fpsIndicator">-- FPS</div>

    <div class="load" id="loading">
      <div>
        <div class="spin"></div>
        <div class="load-text" id="loadingText">กำลังเปิดกล้อง...</div>
      </div>
    </div>
  </div>

  <div class="stat">
    <span class="dot"></span>
    <span id="statusText">กำลังเริ่ม...</span>
  </div>

  <div class="ctrls">
    <button class="btn" id="torchBtn" onclick="toggleTorch()" style="display:none">🔆 ไฟ</button>
    <button class="btn" id="switchBtn" onclick="switchCamera()" style="display:none">🔄 สลับ</button>
    <button class="btn" id="pauseBtn" onclick="togglePause()" style="display:none">⏸️ หยุด</button>
    <button class="btn" onclick="openManualInput()">⌨️ กรอกเอง</button>
    <button class="btn red" onclick="closeAndReturn()">✕ ปิด</button>
  </div>
</div>

<!-- Result Popup -->
<div class="popup hidden" id="resultPopup">
  <div class="popup-card">
    <span class="popup-icon" id="resultIcon">✅</span>
    <div class="popup-title" id="resultTitle">สแกนสำเร็จ</div>
    <div class="popup-code" id="resultCode">—</div>
    <div class="popup-info" id="resultInfo">ตรวจสอบรหัสก่อนยืนยัน</div>
    <div class="popup-actions">
      <button class="pbtn grey" onclick="rescan()">🔄 สแกนใหม่</button>
      <button class="pbtn green" onclick="confirmAndReturn()">✅ ยืนยัน</button>
    </div>
  </div>
</div>

<!-- Manual -->
<div class="popup hidden" id="manualPopup">
  <div class="popup-card">
    <span class="popup-icon">⌨️</span>
    <div class="popup-title" style="color:#E30613">กรอกเอง</div>
    <input type="text"
           class="manual-input"
           id="manualInput"
           placeholder="พิมพ์บาร์โค้ด / รหัส..."
           autocomplete="off"
           autocorrect="off"
           autocapitalize="off"
           spellcheck="false">
    <div class="popup-actions">
      <button class="pbtn grey" onclick="closeManual()">ยกเลิก</button>
      <button class="pbtn green" onclick="submitManual()">ตกลง</button>
    </div>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script>
'use strict';

/* ============================================================
   📋 CONFIG
============================================================ */
var CONFIG = {
  // Scanning
  maxDecodeFPS: 30,           // สูงสุด 30 fps decode
  minDecodeFPS: 10,           // ต่ำสุด
  targetDecodeMs: 33,         // เป้าหมาย 30fps
  debounceMs: 800,            // กันสแกนซ้ำ
  
  // ROI (Region of Interest) — ครอปเฉพาะกลางภาพ
  roiPercent: 0.75,           // ใช้ 75% กลางภาพ
  
  // Camera
  targetWidth: 1920,          // กล้องหลังความละเอียดสูง
  targetHeight: 1080,
  targetFPS: 30
};

var config = {
  returnUrl: '',
  scanMode: 'text',
  label: 'สแกนบาร์โค้ด / QR'
};

var device = {
  isIOS: /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream,
  isAndroid: /Android/i.test(navigator.userAgent)
};

/* ============================================================
   📦 STATE
============================================================ */
var state = {
  stream: null,
  videoTrack: null,
  video: null,
  detector: null,
  zxingReader: null,
  activeEngine: null,
  
  isScanning: false,
  isPaused: false,
  rafId: null,
  
  // Performance
  lastDecodeTime: 0,
  decodeInterval: 33,          // ms (30fps)
  fps: 0,
  frameCount: 0,
  fpsSampleStart: 0,
  
  // Result
  lastResult: '',
  lastResultTime: 0,
  pendingResult: '',
  
  // Camera
  devices: [],
  currentDeviceIndex: 0,
  torchOn: false,
  torchAvailable: false,
  
  // Canvas (สำหรับ ROI crop)
  canvas: null,
  ctx: null,
  
  // Stats
  decodeAttempts: 0,
  decodeSuccess: 0,
  avgDecodeTime: 0
};

/* ============================================================
   🎯 INIT
============================================================ */
window.addEventListener('load', function() {
  var params = new URLSearchParams(location.search);
  config.returnUrl = params.get('returnUrl') || params.get('ret') || '';
  config.scanMode = params.get('mode') || 'text';
  config.label = params.get('label') || 'สแกนบาร์โค้ด / QR';

  document.getElementById('headerTitle').textContent = config.label;

  updateStatusForMode();

  // ตรวจ In-App Browser
  if (detectInAppBrowser()) return;

  // ตรวจ HTTPS
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
    showError('⚠️ ต้องใช้ HTTPS', 'เปิดผ่าน https://');
    return;
  }

  // ตรวจ API
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showError('เบราว์เซอร์ไม่รองรับกล้อง', 'ใช้ Chrome (Android) หรือ Safari (iOS)');
    return;
  }

  // Setup canvas สำหรับ ROI
  setupCanvas();

  // เริ่ม
  initCamera();
});

function updateStatusForMode() {
  var el = document.getElementById('statusText');
  if (config.scanMode === 'item') el.textContent = '📦 เล็งบาร์โค้ดสินค้า';
  else if (config.scanMode === 'pallet') el.textContent = '🚚 เล็ง QR Code พาเลท';
  else el.textContent = '⚡ เล็งบาร์โค้ดให้เต็มกรอบ';
}

function detectInAppBrowser() {
  var ua = navigator.userAgent || '';
  var isLine = /Line\//i.test(ua);
  var isFacebook = /FBAN|FBAV|FB_IAB|FB4A|FBIOS/i.test(ua);
  var isInstagram = /Instagram/i.test(ua);
  var isTikTok = /TikTok|BytedanceWebview/i.test(ua);

  if (isLine || isFacebook || isInstagram || isTikTok) {
    var app = isLine ? 'LINE' : isFacebook ? 'Facebook' : isInstagram ? 'Instagram' : 'TikTok';
    showError('⚠️ ต้องเปิดใน Chrome / Safari', 'เปิดจาก ' + app + ' ไม่ได้<br><br>กด ⋮ → เปิดในเบราว์เซอร์');
    return true;
  }
  return false;
}

/* ============================================================
   🎨 Setup Canvas for ROI
============================================================ */
function setupCanvas() {
  state.canvas = document.createElement('canvas');
  state.ctx = state.canvas.getContext('2d', { willReadFrequently: true });
}

/* ============================================================
   📷 Camera Init
============================================================ */
function initCamera() {
  state.video = document.getElementById('video');

  // ✅ ลำดับ: exact environment → ideal → deviceId
  requestCamera({ facingMode: { exact: 'environment' } })
    .catch(function(err) {
      console.warn('exact fail:', err.name);
      return requestCamera({ facingMode: { ideal: 'environment' } });
    })
    .catch(function() {
      return tryDeviceIdCamera();
    })
    .catch(function(err) {
      console.error('All camera fail:', err);
      handleCameraError(err);
    });
}

function requestCamera(constraints) {
  var videoConstraints = {
    width: { ideal: CONFIG.targetWidth, min: 640 },
    height: { ideal: CONFIG.targetHeight, min: 480 },
    frameRate: { ideal: CONFIG.targetFPS, min: 15 }
  };

  if (constraints.facingMode) videoConstraints.facingMode = constraints.facingMode;
  if (constraints.deviceId) videoConstraints.deviceId = constraints.deviceId;

  return navigator.mediaDevices.getUserMedia({
    audio: false,
    video: videoConstraints
  }).then(function(stream) {
    return setupStream(stream);
  });
}

function tryDeviceIdCamera() {
  return navigator.mediaDevices.enumerateDevices()
    .then(function(devices) {
      state.devices = devices.filter(function(d) { return d.kind === 'videoinput'; });
      if (state.devices.length === 0) return Promise.reject(new Error('No camera'));

      var backCam = findBackCamera(state.devices) || state.devices[state.devices.length - 1];
      var idx = state.devices.indexOf(backCam);
      state.currentDeviceIndex = idx >= 0 ? idx : 0;

      return requestCamera({ deviceId: { exact: backCam.deviceId } });
    });
}

function findBackCamera(devices) {
  var keywords = ['back', 'rear', 'environment', 'หลัง', 'primary', 'world', 'main'];
  for (var i = 0; i < devices.length; i++) {
    var label = (devices[i].label || '').toLowerCase();
    for (var k = 0; k < keywords.length; k++) {
      if (label.indexOf(keywords[k]) !== -1) return devices[i];
    }
  }
  return null;
}

function setupStream(stream) {
  return new Promise(function(resolve) {
    state.stream = stream;
    state.videoTrack = stream.getVideoTracks()[0];

    if (!state.videoTrack) { resolve(); return; }

    var video = state.video;
    video.srcObject = stream;
    video.setAttribute('playsinline', 'true');
    video.setAttribute('webkit-playsinline', 'true');
    video.setAttribute('muted', 'true');
    video.muted = true;

    var onReady = function() {
      video.removeEventListener('loadedmetadata', onReady);

      // บังคับ focus continuous
      applyTrackSettings()
        .then(function() {
          document.getElementById('loading').classList.add('hidden');
          startEngine();
          loadCameraList();
          logCameraInfo();
          resolve();
        })
        .catch(function() {
          document.getElementById('loading').classList.add('hidden');
          startEngine();
          loadCameraList();
          resolve();
        });
    };

    video.addEventListener('loadedmetadata', onReady);
    video.play().catch(function(){});

    setTimeout(function() {
      if (!state.isScanning && video.readyState >= 2) onReady();
    }, 2000);
  });
}

function applyTrackSettings() {
  return new Promise(function(resolve) {
    if (!state.videoTrack) { resolve(); return; }

    var caps = state.videoTrack.getCapabilities ? state.videoTrack.getCapabilities() : {};
    var advanced = [];

    // Continuous focus
    if (caps.focusMode && caps.focusMode.indexOf('continuous') !== -1) {
      advanced.push({ focusMode: 'continuous' });
    }

    // Torch
    if (caps.torch) {
      state.torchAvailable = true;
      document.getElementById('torchBtn').style.display = 'flex';
    }

    if (advanced.length === 0) { resolve(); return; }

    state.videoTrack.applyConstraints({ advanced: advanced })
      .then(function() { resolve(); })
      .catch(function() { resolve(); });
  });
}

function loadCameraList() {
  navigator.mediaDevices.enumerateDevices()
    .then(function(devices) {
      state.devices = devices.filter(function(d) { return d.kind === 'videoinput'; });
      if (state.devices.length > 1) {
        document.getElementById('switchBtn').style.display = 'flex';
      }
    })
    .catch(function() {});
}

function logCameraInfo() {
  try {
    var s = state.videoTrack.getSettings ? state.videoTrack.getSettings() : {};
    console.log('📷 Camera:', {
      resolution: s.width + 'x' + s.height,
      frameRate: s.frameRate,
      facingMode: s.facingMode
    });
  } catch(e) {}
}

/* ============================================================
   🚀 Engine — BarcodeDetector (native, เร็วสุด)
============================================================ */
function startEngine() {
  state.isScanning = true;
  document.getElementById('pauseBtn').style.display = 'flex';

  if ('BarcodeDetector' in window) {
    tryInitNativeDetector();
    return;
  }

  if (typeof ZXing !== 'undefined') {
    initZXing();
    return;
  }

  showError('ไม่พบตัวสแกน', 'ใช้ Chrome ล่าสุด');
}

function tryInitNativeDetector() {
  var formatSets = [
    ['qr_code', 'ean_13', 'ean_8', 'code_128', 'code_39', 'code_93', 'upc_a', 'upc_e', 'itf', 'codabar'],
    ['qr_code', 'ean_13', 'ean_8', 'code_128', 'code_39', 'upc_a', 'upc_e'],
    ['qr_code', 'ean_13', 'code_128'],
    undefined
  ];

  var idx = 0;
  function tryNext() {
    if (idx >= formatSets.length) {
      console.warn('Native fail → ZXing');
      if (typeof ZXing !== 'undefined') initZXing();
      else showError('ไม่พบตัวสแกน', '');
      return;
    }

    var formats = formatSets[idx++];
    var detector;
    try {
      detector = formats ? new BarcodeDetector({ formats: formats }) : new BarcodeDetector();
    } catch(e) { tryNext(); return; }

    detector.detect(state.video)
      .then(function() {
        state.detector = detector;
        state.activeEngine = 'native';
        console.log('✅ BarcodeDetector ready');
        document.getElementById('statusText').textContent = '⚡ โหมดเร็ว — เล็งบาร์โค้ด';
        startNativeLoop();
      })
      .catch(function() { tryNext(); });
  }
  tryNext();
}

/* ============================================================
   ⚡ Native Loop — Adaptive FPS + ROI
============================================================ */
function startNativeLoop() {
  state.frameCount = 0;
  state.fpsSampleStart = performance.now();

  var loop = function() {
    if (!state.isScanning) {
      state.rafId = requestAnimationFrame(loop);
      return;
    }

    if (state.isPaused) {
      state.rafId = requestAnimationFrame(loop);
      return;
    }

    var now = performance.now();

    // ✅ FPS counter
    state.frameCount++;
    if (now - state.fpsSampleStart >= 1000) {
      state.fps = state.frameCount;
      state.frameCount = 0;
      state.fpsSampleStart = now;
      updateFpsIndicator();
    }

    // ✅ Adaptive frame skip — ปรับตามเวลาที่ใช้
    if (now - state.lastDecodeTime >= state.decodeInterval) {
      state.lastDecodeTime = now;
      doNativeDecode();
    }

    state.rafId = requestAnimationFrame(loop);
  };
  loop();
}

function doNativeDecode() {
  var t0 = performance.now();
  state.decodeAttempts++;

  // ✅ สแกน video frame โดยตรง (เร็วที่สุด)
  // BarcodeDetector จะ optimize เอง
  state.detector.detect(state.video)
    .then(function(barcodes) {
      var decodeTime = performance.now() - t0;
      
      // คำนวณเวลาเฉลี่ย
      state.avgDecodeTime = (state.avgDecodeTime * 0.9) + (decodeTime * 0.1);

      // ✅ Adaptive interval — ถ้า decode เร็ว → ถี่ขึ้น
      if (state.avgDecodeTime < 20) {
        state.decodeInterval = 16;  // 60fps
      } else if (state.avgDecodeTime < 40) {
        state.decodeInterval = 33;  // 30fps
      } else if (state.avgDecodeTime < 80) {
        state.decodeInterval = 66;  // 15fps
      } else {
        state.decodeInterval = 100; // 10fps
      }

      if (barcodes && barcodes.length > 0) {
        state.decodeSuccess++;
        for (var i = 0; i < barcodes.length; i++) {
          if (barcodes[i] && barcodes[i].rawValue) {
            // ✅ Flash frame
            flashDetectedFrame();
            onScanned(barcodes[i].rawValue, barcodes[i].format);
            break;
          }
        }
      }
    })
    .catch(function() {
      // ignore
    });
}

function updateFpsIndicator() {
  var el = document.getElementById('fpsIndicator');
  if (!el) return;
  var fps = state.fps;
  var color = fps >= 20 ? '#00E676' : fps >= 10 ? '#FFB800' : '#DC2626';
  el.style.color = color;
  el.textContent = fps + ' FPS';
}

function flashDetectedFrame() {
  var frame = document.getElementById('scanFrame');
  if (!frame) return;
  frame.classList.add('detected');
  setTimeout(function() {
    frame.classList.remove('detected');
  }, 500);
}

/* ============================================================
   🔧 ZXing Fallback
============================================================ */
function initZXing() {
  if (typeof ZXing === 'undefined') {
    showError('ไม่พบ ZXing', '');
    return;
  }

  try {
    var hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
      ZXing.BarcodeFormat.QR_CODE,
      ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.UPC_A,
      ZXing.BarcodeFormat.UPC_E,
      ZXing.BarcodeFormat.ITF
    ]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

    var reader = new ZXing.BrowserMultiFormatReader(hints);
    state.zxingReader = reader;
    state.activeEngine = 'zxing';

    document.getElementById('statusText').textContent = '📷 เล็งบาร์โค้ดให้เต็มกรอบ';

    reader.decodeFromVideoDevice(null, 'video', function(result, err) {
      if (!state.isScanning || state.isPaused) return;
      if (result) {
        onScanned(result.getText(), 'zxing');
      }
    });
  } catch(e) {
    console.error('ZXing error:', e);
    showError('ตัวสแกนขัดข้อง', String(e.message || e));
  }
}

/* ============================================================
   🎯 สแกนสำเร็จ
============================================================ */
function onScanned(text, format) {
  if (!text) return;

  var now = Date.now();
  if (text === state.lastResult && (now - state.lastResultTime) < CONFIG.debounceMs) return;

  state.lastResult = text;
  state.lastResultTime = now;
  state.pendingResult = text;
  state.isPaused = true;

  // หยุดสแกนชั่วคราว
  state.isScanning = false;

  // Feedback
  beepSuccess();
  haptic([50, 40, 50]);
  showSuccessFlash();

  setTimeout(function() {
    showResultPopup(text, format);
  }, 100);
}

/* ============================================================
   💬 Result Popup
============================================================ */
function showResultPopup(code, format) {
  document.getElementById('resultCode').textContent = code;

  var formatText = format ? String(format).toUpperCase() : '';
  document.getElementById('resultInfo').textContent = formatText
    ? 'รูปแบบ: ' + formatText
    : 'ตรวจสอบรหัสก่อนยืนยัน';

  document.getElementById('resultIcon').textContent = '✅';
  document.getElementById('resultTitle').textContent = 'สแกนสำเร็จ';
  document.getElementById('resultPopup').classList.remove('hidden');
}

function rescan() {
  state.pendingResult = '';
  document.getElementById('resultPopup').classList.add('hidden');

  setTimeout(function() {
    state.lastResult = '';
    state.lastResultTime = 0;
    state.isScanning = true;
    state.isPaused = false;
    state.lastDecodeTime = 0;
  }, 300);
}

function confirmAndReturn() {
  if (!state.pendingResult) {
    toast('ไม่มีค่าที่สแกนได้', 'warn');
    return;
  }
  returnToApp(state.pendingResult);
}

/* ============================================================
   ⏸️ Pause / Resume
============================================================ */
function togglePause() {
  state.isPaused = !state.isPaused;
  var btn = document.getElementById('pauseBtn');
  if (state.isPaused) {
    btn.textContent = '▶️ เล่น';
    document.getElementById('statusText').textContent = '⏸️ หยุดชั่วคราว';
  } else {
    btn.textContent = '⏸️ หยุด';
    updateStatusForMode();
  }
}

/* ============================================================
   🚀 Return to WMS
============================================================ */
function returnToApp(code) {
  if (!code) return;

  beepSuccess();
  haptic([50, 40, 50]);

  stopAll();

  if (!config.returnUrl) {
    document.getElementById('resultCode').textContent = code;
    document.getElementById('resultInfo').textContent = 'กรุณาก็อปโค้ดไปวางใน WMS';
    document.getElementById('resultIcon').textContent = '📋';
    document.getElementById('resultTitle').textContent = 'ก็อปโค้ดไปวาง';
    document.getElementById('resultPopup').classList.remove('hidden');
    return;
  }

  var url = config.returnUrl;
  var sep = url.indexOf('?') === -1 ? '?' : '&';
  var finalUrl = url + sep + 'scanresult=' + encodeURIComponent(code) +
                 '#scanresult=' + encodeURIComponent(code);

  document.getElementById('resultIcon').textContent = '🚀';
  document.getElementById('resultTitle').textContent = 'กำลังกลับไปที่ WMS...';

  setTimeout(function() {
    try { window.location.href = finalUrl; }
    catch(e) { window.location.assign(finalUrl); }
  }, 300);
}

function closeAndReturn() {
  stopAll();
  if (config.returnUrl) {
    try { window.location.href = config.returnUrl; }
    catch(e) { window.history.back(); }
  } else {
    window.close();
  }
}

function stopAll() {
  state.isScanning = false;
  state.isPaused = false;

  if (state.rafId) {
    cancelAnimationFrame(state.rafId);
    state.rafId = null;
  }

  if (state.zxingReader) {
    try { state.zxingReader.reset(); } catch(e) {}
    state.zxingReader = null;
  }

  state.detector = null;

  if (state.stream) {
    try {
      state.stream.getTracks().forEach(function(t) { t.stop(); });
    } catch(e) {}
    state.stream = null;
  }

  state.videoTrack = null;

  if (state.video) {
    try { state.video.srcObject = null; } catch(e) {}
  }
}

/* ============================================================
   🔆 Torch / 🔄 Switch
============================================================ */
function toggleTorch() {
  if (!state.videoTrack || !state.torchAvailable) {
    toast('อุปกรณ์ไม่รองรับไฟ', 'warn');
    return;
  }

  state.torchOn = !state.torchOn;

  state.videoTrack.applyConstraints({
    advanced: [{ torch: state.torchOn }]
  }).then(function() {
    document.getElementById('torchBtn').textContent = state.torchOn ? '🔅 ไฟ' : '🔆 ไฟ';
  }).catch(function() {
    toast('เปิดไฟไม่สำเร็จ', 'warn');
    state.torchOn = !state.torchOn;
  });
}

function switchCamera() {
  if (state.devices.length < 2) return;

  stopAll();
  state.currentDeviceIndex = (state.currentDeviceIndex + 1) % state.devices.length;
  var nextDevice = state.devices[state.currentDeviceIndex];

  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('loadingText').textContent = 'กำลังสลับกล้อง...';

  setTimeout(function() {
    requestCamera({ deviceId: { exact: nextDevice.deviceId } })
      .then(function() {
        toast('สลับกล้องแล้ว', 'info', 1200);
      })
      .catch(function(e) {
        console.error(e);
        toast('สลับกล้องไม่สำเร็จ', 'error');
        document.getElementById('loading').classList.add('hidden');
      });
  }, 200);
}

/* ============================================================
   ⌨️ Manual
============================================================ */
function openManualInput() {
  document.getElementById('manualInput').value = '';
  document.getElementById('manualPopup').classList.remove('hidden');
  setTimeout(function() {
    document.getElementById('manualInput').focus();
  }, 200);
}

function closeManual() {
  document.getElementById('manualPopup').classList.add('hidden');
}

function submitManual() {
  var val = document.getElementById('manualInput').value.trim();
  if (!val) {
    toast('กรุณากรอกค่า', 'warn');
    return;
  }
  closeManual();
  state.pendingResult = val;
  returnToApp(val);
}

/* ============================================================
   🎨 Helper
============================================================ */
function showSuccessFlash() {
  var vp = document.querySelector('.vp');
  if (!vp) return;

  var old = vp.querySelector('.flash');
  if (old) old.remove();

  var flash = document.createElement('div');
  flash.className = 'flash';
  vp.appendChild(flash);

  setTimeout(function() {
    if (flash.parentNode) flash.remove();
  }, 350);
}

function showError(msg, hint) {
  document.getElementById('loading').innerHTML =
    '<div style="padding:24px;text-align:center">' +
    '<div style="font-size:56px;margin-bottom:12px">🚫</div>' +
    '<div style="font-weight:900;font-size:16px;margin-bottom:8px;color:#fff">' + msg + '</div>' +
    '<div style="font-size:12px;color:rgba(255,255,255,.7);line-height:1.7;margin-bottom:20px">' + hint + '</div>' +
    '<button class="btn red" onclick="openManualInput()" ' +
    'style="width:100%;max-width:240px;margin:0 auto;padding:14px">' +
    '⌨️ กรอกเอง' +
    '</button>' +
    '</div>';
  document.getElementById('loading').classList.remove('hidden');
}

function handleCameraError(err) {
  var name = (err && err.name) || '';
  if (name === 'NotAllowedError' || name === 'SecurityError') {
    showError('🚫 กล้องถูกบล็อก', 'กด 🔒 → Camera → Allow');
  } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
    showError('ไม่พบกล้อง', 'อุปกรณ์นี้ไม่มีกล้อง');
  } else if (name === 'NotReadableError') {
    showError('กล้องถูกใช้งาน', 'ปิดแอปอื่นที่ใช้กล้อง');
  } else {
    showError('ไม่สามารถเปิดกล้องได้', String(err && err.message || ''));
  }
}

function toast(msg, type, duration) {
  type = type || 'info';
  duration = duration || 2000;
  var stack = document.getElementById('toastStack');
  if (!stack) return;

  var el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  stack.appendChild(el);

  setTimeout(function() {
    el.style.transition = 'opacity .25s, transform .25s';
    el.style.opacity = '0';
    el.style.transform = 'translateX(120%)';
    setTimeout(function() {
      if (el.parentNode) el.remove();
    }, 250);
  }, duration);
}

function haptic(p) {
  if (navigator.vibrate) {
    try { navigator.vibrate(p || 10); } catch(e) {}
  }
}

function beepSuccess() {
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    var ctx = new AC();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.value = 1500;
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.15);
    setTimeout(function() {
      try { ctx.close(); } catch(e) {}
    }, 500);
  } catch(e) {}
}

/* ============================================================
   🧹 Cleanup
============================================================ */
window.addEventListener('beforeunload', stopAll);
window.addEventListener('pagehide', stopAll);

document.addEventListener('visibilitychange', function() {
  if (document.hidden) {
    if (state.isScanning) {
      state.isPaused = true;
    }
  } else {
    if (!state.pendingResult) {
      state.isPaused = false;
      state.lastDecodeTime = 0;
    }
  }
});
</script>
