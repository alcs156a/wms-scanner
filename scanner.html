<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#E30613">
  <title>Scanner - WMS Makro 156</title>

  <!-- Html5Qrcode Library — เร็วที่สุดสำหรับ web scanning -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{
      width:100%;height:100%;overflow:hidden;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Sarabun","Noto Sans Thai",sans-serif;
      background:#000;color:#fff;
    }

    .scanner-wrap{
      position:fixed;inset:0;
      display:flex;flex-direction:column;
      background:#000;
    }

    /* ===== Header ===== */
    .scanner-header{
      background:linear-gradient(135deg,#E30613,#B00410);
      padding:14px 18px;
      display:flex;justify-content:space-between;align-items:center;
      box-shadow:0 4px 20px rgba(227,6,19,.4);
      z-index:10;flex-shrink:0;
    }
    .scanner-header h1{
      font-size:16px;font-weight:900;letter-spacing:.3px;
      display:flex;align-items:center;gap:8px;
    }
    .scanner-header .close-btn{
      width:36px;height:36px;border-radius:50%;
      background:rgba(255,255,255,.2);color:#fff;
      display:grid;place-items:center;font-size:18px;
      border:none;cursor:pointer;font-weight:900;
    }
    .scanner-header .close-btn:hover{background:rgba(255,255,255,.35)}

    /* ===== Reader Container ===== */
    .scanner-viewport{
      position:relative;
      flex:1;
      background:#000;
      overflow:hidden;
    }

    #reader{
      width:100%;
      height:100%;
      position:relative;
    }

    /* ซ่อน UI ของ html5-qrcode ที่ไม่ต้องการ */
    #reader__dashboard_section_csr,
    #reader__dashboard_section_swaplink,
    #reader__status_span,
    #reader__header_message,
    #reader__filescan_input,
    #reader__dashboard{
      display:none !important;
    }

    #reader video{
      width:100% !important;
      height:100% !important;
      object-fit:cover !important;
      display:block !important;
    }

    /* ===== Custom Overlay ===== */
    .custom-overlay{
      position:absolute;inset:0;
      display:grid;place-items:center;
      pointer-events:none;
      z-index:5;
    }
    .custom-frame{
      width:80%;max-width:340px;
      aspect-ratio:1/1;
      border:3px solid rgba(255,255,255,.95);
      border-radius:20px;
      box-shadow:0 0 0 9999px rgba(0,0,0,.55);
      position:relative;
      animation:framePulse 1.8s ease-in-out infinite;
    }
    @keyframes framePulse{
      0%,100%{border-color:rgba(255,255,255,.95);box-shadow:0 0 0 9999px rgba(0,0,0,.55),0 0 0 0 rgba(0,166,81,.7)}
      50%{border-color:rgba(0,230,118,1);box-shadow:0 0 0 9999px rgba(0,0,0,.55),0 0 0 14px rgba(0,230,118,0)}
    }
    .custom-frame::before,
    .custom-frame::after{
      content:'';position:absolute;
      width:42px;height:42px;
      border:4px solid #00E676;border-radius:10px;
    }
    .custom-frame::before{top:-4px;left:-4px;border-right:none;border-bottom:none}
    .custom-frame::after{bottom:-4px;right:-4px;border-left:none;border-top:none}

    /* Laser */
    .custom-laser{
      position:absolute;
      left:10%;right:10%;
      height:3px;
      background:linear-gradient(90deg,transparent,#00E676,transparent);
      box-shadow:0 0 16px #00E676;
      border-radius:2px;
      top:10%;
      animation:laserScan 1.6s ease-in-out infinite;
    }
    @keyframes laserScan{
      0%,100%{top:10%}
      50%{top:calc(90% - 3px)}
    }

    /* Loading */
    .scanner-loading{
      position:absolute;inset:0;
      display:grid;place-items:center;
      background:rgba(0,0,0,.85);
      z-index:20;text-align:center;padding:24px;
    }
    .spinner{
      width:56px;height:56px;
      border:4px solid rgba(255,255,255,.15);
      border-top-color:#E30613;
      border-right-color:#FF4D57;
      border-radius:50%;
      animation:spin 1s linear infinite;
      margin:0 auto 16px;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-text{
      font-size:14px;font-weight:700;color:rgba(255,255,255,.85);
      margin-top:8px;
    }

    /* Status Bar */
    .scanner-status{
      padding:10px 18px;
      background:rgba(0,0,0,.95);
      text-align:center;
      font-size:12.5px;font-weight:700;
      color:rgba(255,255,255,.9);
      border-top:1px solid rgba(255,255,255,.1);
      flex-shrink:0;
      display:flex;align-items:center;justify-content:center;gap:8px;
    }
    .scanner-status .dot{
      width:8px;height:8px;border-radius:50%;
      background:#00E676;box-shadow:0 0 8px #00E676;
      animation:dotPulse 1.2s infinite;
    }
    @keyframes dotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}

    /* Controls */
    .scanner-controls{
      display:flex;gap:8px;
      padding:12px 16px 16px;
      background:#000;
      flex-shrink:0;
      flex-wrap:wrap;
    }
    .ctrl-btn{
      flex:1;min-width:90px;min-height:48px;
      border-radius:12px;
      font-weight:800;font-size:13px;
      border:1.5px solid rgba(255,255,255,.25);
      background:rgba(255,255,255,.12);color:#fff;
      cursor:pointer;
      display:flex;align-items:center;justify-content:center;gap:6px;
      transition:.2s;
    }
    .ctrl-btn:hover{background:rgba(255,255,255,.25)}
    .ctrl-btn:active{transform:scale(.96)}
    .ctrl-btn.primary{
      background:linear-gradient(135deg,#E30613,#B00410);
      border-color:transparent;
      box-shadow:0 4px 14px rgba(227,6,19,.35);
    }

    /* Result Popup */
    .result-popup{
      position:fixed;inset:0;
      background:rgba(0,0,0,.85);
      display:grid;place-items:center;
      padding:20px;z-index:100;
      animation:fadeIn .2s;
    }
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .result-card{
      background:#fff;color:#000;
      border-radius:20px;
      width:100%;max-width:420px;
      padding:24px 22px;
      text-align:center;
      box-shadow:0 24px 60px rgba(0,0,0,.5);
      animation:popIn .3s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
    .result-icon{font-size:52px;margin-bottom:10px;display:block;}
    .result-title{font-size:15px;font-weight:900;color:#00A651;margin-bottom:12px;}
    .result-code{
      font-family:'Courier New',monospace;
      font-size:18px;font-weight:900;
      color:#E30613;background:#F5F5F5;
      padding:14px 16px;border-radius:12px;
      word-break:break-all;margin-bottom:16px;
      border:2px dashed #E30613;
      min-height:52px;
      display:flex;align-items:center;justify-content:center;
    }
    .result-info{font-size:11.5px;color:#666;margin-bottom:14px;line-height:1.5;}
    .result-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .result-btn{
      padding:14px;border-radius:12px;border:none;
      font-weight:900;font-size:14px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;gap:6px;
      transition:.2s;
    }
    .result-btn.rescan{background:#F5F5F5;color:#333;}
    .result-btn.rescan:hover{background:#E8E8E8}
    .result-btn.confirm{
      background:linear-gradient(135deg,#00A651,#008a43);
      color:#fff;box-shadow:0 4px 14px rgba(0,166,81,.35);
    }
    .result-btn.confirm:hover{transform:translateY(-1px)}

    /* Manual Input */
    .manual-popup{
      position:fixed;inset:0;
      background:rgba(0,0,0,.85);
      display:grid;place-items:center;
      padding:20px;z-index:110;
    }
    .manual-card{
      background:#fff;color:#000;
      border-radius:20px;width:100%;max-width:420px;
      padding:24px 22px;
    }
    .manual-card h3{font-size:16px;font-weight:900;margin-bottom:14px;color:#E30613;}
    .manual-input{
      width:100%;padding:14px 16px;
      border:2px solid #E8E8E8;border-radius:12px;
      font-size:16px;font-family:monospace;font-weight:700;
      outline:none;margin-bottom:12px;
    }
    .manual-input:focus{border-color:#E30613}

    /* Toast */
    .toast-stack{
      position:fixed;top:80px;right:16px;
      display:flex;flex-direction:column;gap:8px;
      z-index:200;max-width:calc(100vw - 32px);
      pointer-events:none;
    }
    .toast{
      background:#333;color:#fff;
      padding:12px 18px;border-radius:12px;
      font-weight:700;font-size:13px;
      box-shadow:0 8px 24px rgba(0,0,0,.4);
      animation:slideIn .3s;pointer-events:auto;
      border-left:4px solid #666;
      max-width:340px;word-break:break-word;
    }
    .toast.success{background:#00A651;border-left-color:#4ADE80}
    .toast.error{background:#DC2626;border-left-color:#F87171}
    .toast.warn{background:#FF9500;border-left-color:#FCD34D}
    .toast.info{background:#0EA5E9;border-left-color:#38BDF8}
    @keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:none;opacity:1}}

    .hidden{display:none!important}

    /* Result flash */
    .flash-success{
      position:absolute;inset:0;
      background:rgba(0,230,118,.4);
      z-index:50;
      pointer-events:none;
      animation:flash .35s;
    }
    @keyframes flash{
      0%{opacity:0}
      50%{opacity:1}
      100%{opacity:0}
    }

    @media (max-width:400px){
      .custom-frame{width:84%}
      .scanner-header h1{font-size:14px}
      .ctrl-btn{min-width:80px;font-size:12px;padding:10px 8px}
    }
  </style>
</head>
<body>

<div class="scanner-wrap">

  <!-- Header -->
  <div class="scanner-header">
    <h1>📷 <span id="headerTitle">สแกนบาร์โค้ด / QR</span></h1>
    <button class="close-btn" onclick="closeAndReturn()" title="ปิด">✕</button>
  </div>

  <!-- Reader Container -->
  <div class="scanner-viewport">
    <div id="reader"></div>

    <!-- Custom overlay frame -->
    <div class="custom-overlay">
      <div class="custom-frame"></div>
      <div class="custom-laser"></div>
    </div>

    <div class="scanner-loading" id="loading">
      <div>
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">กำลังเปิดกล้อง...</div>
      </div>
    </div>
  </div>

  <!-- Status -->
  <div class="scanner-status">
    <span class="dot"></span>
    <span id="statusText">เล็งกล้องไปที่บาร์โค้ดหรือ QR Code</span>
  </div>

  <!-- Controls -->
  <div class="scanner-controls">
    <button class="ctrl-btn" id="torchBtn" onclick="toggleTorch()" style="display:none">🔆 เปิดไฟ</button>
    <button class="ctrl-btn" id="switchBtn" onclick="switchCamera()" style="display:none">🔄 สลับกล้อง</button>
    <button class="ctrl-btn" onclick="openManualInput()">⌨️ กรอกเอง</button>
    <button class="ctrl-btn primary" onclick="closeAndReturn()">✕ ปิด</button>
  </div>
</div>

<!-- Result Popup -->
<div class="result-popup hidden" id="resultPopup">
  <div class="result-card">
    <span class="result-icon" id="resultIcon">✅</span>
    <div class="result-title" id="resultTitle">สแกนสำเร็จ</div>
    <div class="result-code" id="resultCode">—</div>
    <div class="result-info" id="resultInfo">ตรวจสอบรหัสก่อนยืนยัน</div>
    <div class="result-actions">
      <button class="result-btn rescan" onclick="rescan()">🔄 สแกนใหม่</button>
      <button class="result-btn confirm" onclick="confirmAndReturn()">✅ ยืนยัน</button>
    </div>
  </div>
</div>

<!-- Manual Input -->
<div class="manual-popup hidden" id="manualPopup">
  <div class="manual-card">
    <h3>⌨️ กรอกเอง</h3>
    <input type="text" class="manual-input" id="manualInput"
           placeholder="พิมพ์บาร์โค้ด / รหัส..."
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <div class="result-actions">
      <button class="result-btn rescan" onclick="closeManual()">ยกเลิก</button>
      <button class="result-btn confirm" onclick="submitManual()">ตกลง</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast-stack" id="toastStack"></div>

<script>
'use strict';

/* ============================================================
   📋 CONFIG
============================================================ */
var config = {
  returnUrl: '',
  scanMode: 'text',
  label: 'สแกนบาร์โค้ด / QR'
};

/* ============================================================
   📦 STATE
============================================================ */
var state = {
  html5QrCode: null,
  isScanning: false,
  lastResult: '',
  lastResultTime: 0,
  pendingResult: '',
  devices: [],
  currentDeviceIndex: 0,
  torchOn: false,
  currentTrack: null,
  activeCameraId: null
};

/* ============================================================
   🎯 INIT
============================================================ */
window.addEventListener('load', function() {
  var params = new URLSearchParams(location.search);
  config.returnUrl = params.get('returnUrl') || params.get('ret') || '';
  config.scanMode = params.get('mode') || 'text';
  config.label = params.get('label') || 'สแกนบาร์โค้ด / QR';

  document.getElementById('headerTitle').textContent = config.label;

  if (config.scanMode === 'item') {
    document.getElementById('statusText').textContent = '📦 เล็งบาร์โค้ดสินค้า';
  } else if (config.scanMode === 'pallet') {
    document.getElementById('statusText').textContent = '🚚 เล็ง QR Code พาเลท';
  }

  startScanner();
});

/* ============================================================
   🚀 เริ่มสแกนด้วย html5-qrcode
============================================================ */
function startScanner() {
  // ตรวจ In-App Browser
  var ua = navigator.userAgent || '';
  var isLine = /Line\//i.test(ua);
  var isFacebook = /FBAN|FBAV|FB_IAB/i.test(ua);
  var isInstagram = /Instagram/i.test(ua);
  var isInApp = isLine || isFacebook || isInstagram;

  if (isInApp) {
    var appName = isLine ? 'LINE' : isFacebook ? 'Facebook' : 'Instagram';
    showError(
      '⚠️ ต้องเปิดใน Chrome / Safari',
      'คุณกำลังเปิดจาก ' + appName + '<br><br>' +
      '<b style="color:#FFB800">วิธีแก้:</b><br>' +
      'กด ⋮ → เปิดในเบราว์เซอร์'
    );
    return;
  }

  if (typeof Html5Qrcode === 'undefined') {
    showError('ไม่พบ Library', 'กรุณารีเฟรชหน้า');
    return;
  }

  // ✅ Config ที่ optimize สำหรับความเร็ว
  // - fps: 30 (สูงสุดที่มือถือทำได้)
  // - qrbox: กว้างพอสำหรับบาร์โค้ด
  // - aspectRatio: 1.0 (จตุรัส)
  // - disableFlip: true (ไม่ต้อง mirror)
  // - experimentalFeatures: useBarCodeDetectorIfSupported (สำคัญ!)

  var scanConfig = {
    fps: 30,
    qrbox: function(viewfinderWidth, viewfinderHeight) {
      // กล่องสแกน 80% ของความกว้าง (บาร์โค้ดยาวต้องกว้าง)
      var minEdge = Math.min(viewfinderWidth, viewfinderHeight);
      var size = Math.floor(minEdge * 0.85);
      return { width: size, height: Math.floor(size * 0.65) };
    },
    aspectRatio: 1.0,
    disableFlip: false,
    experimentalFeatures: {
      useBarCodeDetectorIfSupported: true  // ⚡ ใช้ BarcodeDetector native
    },
    // รูปแบบบาร์โค้ดที่รองรับ
    formatsToSupport: [
      Html5QrcodeSupportedFormats.QR_CODE,
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.CODE_93,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.ITF,
      Html5QrcodeSupportedFormats.CODABAR,
      Html5QrcodeSupportedFormats.DATA_MATRIX,
      Html5QrcodeSupportedFormats.PDF_417
    ],
    // ⚡ ให้ลอง decode ทุกๆ เฟรม
    videoConstraints: {
      facingMode: { ideal: 'environment' },
      width: { ideal: 1280, min: 640 },
      height: { ideal: 720, min: 480 },
      frameRate: { ideal: 30, min: 15 },
      focusMode: 'continuous'
    }
  };

  state.html5QrCode = new Html5Qrcode('reader', {
    verbose: false,
    formatsToSupport: scanConfig.formatsToSupport,
    useBarCodeDetectorIfSupported: true  // ⚡⚡⚡ สำคัญมาก
  });

  // เริ่มกล้อง
  startCamera(scanConfig);
}

/* ============================================================
   📷 เริ่มกล้อง
============================================================ */
function startCamera(scanConfig) {
  // ลอง enumerate devices เพื่อหากล้องหลัง
  Html5Qrcode.getCameras().then(function(devices) {
    if (!devices || devices.length === 0) {
      showError('ไม่พบกล้อง', 'อุปกรณ์นี้ไม่มีกล้อง');
      return;
    }

    state.devices = devices;
    state.currentDeviceIndex = 0;

    // ✅ หากล้องหลัง (back camera)
    var backCamera = null;
    for (var i = 0; i < devices.length; i++) {
      var label = (devices[i].label || '').toLowerCase();
      if (label.indexOf('back') !== -1 ||
          label.indexOf('rear') !== -1 ||
          label.indexOf('environment') !== -1 ||
          label.indexOf('หลัง') !== -1) {
        backCamera = devices[i];
        state.currentDeviceIndex = i;
        break;
      }
    }

    // ถ้าไม่เจอกล้องหลัง → ใช้ตัวสุดท้าย (ปกติคือหลัง)
    if (!backCamera && devices.length > 1) {
      backCamera = devices[devices.length - 1];
      state.currentDeviceIndex = devices.length - 1;
    } else if (!backCamera) {
      backCamera = devices[0];
    }

    state.activeCameraId = backCamera.id;

    // ถ้ามีหลายกล้อง → แสดงปุ่มสลับ
    if (devices.length > 1) {
      document.getElementById('switchBtn').style.display = 'flex';
    }

    // ✅ เริ่มสแกนด้วยกล้องหลัง
    startScanning(backCamera.id, scanConfig);
  }).catch(function(err) {
    console.warn('getCameras error:', err);
    // ถ้า getCameras ไม่ได้ → ใช้ facingMode
    startScanning({ facingMode: 'environment' }, scanConfig);
  });
}

/* ============================================================
   ▶️ เริ่มสแกนจริง
============================================================ */
function startScanning(cameraIdOrConfig, scanConfig) {
  var startConfig = {
    fps: 30,
    qrbox: scanConfig.qrbox,
    aspectRatio: scanConfig.aspectRatio,
    disableFlip: false,
    experimentalFeatures: {
      useBarCodeDetectorIfSupported: true
    },
    videoConstraints: {
      frameRate: { ideal: 30, min: 15 },
      focusMode: 'continuous'
    }
  };

  // ถ้า cameraId เป็น object (facingMode) → ใช้เลย
  var cameraArg = cameraIdOrConfig;
  if (typeof cameraIdOrConfig === 'object' && cameraIdOrConfig.facingMode) {
    startConfig.videoConstraints = Object.assign({}, startConfig.videoConstraints, cameraIdOrConfig);
    cameraArg = { facingMode: 'environment' };
  }

  state.html5QrCode.start(
    cameraArg,
    startConfig,
    onScanSuccess,
    onScanError
  ).then(function() {
    // ✅ กล้องเปิดแล้ว
    state.isScanning = true;
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('statusText').textContent = '⚡ สแกนเร็ว — เล็งบาร์โค้ด';

    // ✅ ดึง video track เพื่อเปิดไฟฉาย
    setTimeout(function() {
      try {
        var video = document.querySelector('#reader video');
        if (video && video.srcObject) {
          state.currentTrack = video.srcObject.getVideoTracks()[0];

          // บังคับ focusMode continuous
          if (state.currentTrack && state.currentTrack.getCapabilities) {
            var caps = state.currentTrack.getCapabilities();
            if (caps.focusMode && caps.focusMode.indexOf('continuous') !== -1) {
              state.currentTrack.applyConstraints({
                advanced: [{ focusMode: 'continuous' }]
              }).catch(function(){});
            }
            if (caps.torch) {
              document.getElementById('torchBtn').style.display = 'flex';
            }
          }
        }
      } catch(e) {
        console.warn('Track error:', e);
      }
    }, 800);

    toast('✅ กล้องพร้อม — เล็งบาร์โค้ด', 'success', 1500);

  }).catch(function(err) {
    console.error('Start error:', err);

    // ลอง fallback แบบง่าย
    if (typeof cameraIdOrConfig === 'object') {
      showError('ไม่สามารถเปิดกล้องได้',
        'กรุณาอนุญาตกล้อง<br><br>' +
        '<b style="color:#FFB800">วิธีแก้:</b><br>' +
        'กด 🔒 หน้า URL → Camera → Allow');
    } else {
      // ลองด้วย facingMode แทน
      startScanning({ facingMode: 'environment' }, scanConfig);
    }
  });
}

/* ============================================================
   ✅ สแกนสำเร็จ
============================================================ */
function onScanSuccess(decodedText, decodedResult) {
  if (!decodedText) return;

  var now = Date.now();
  // กันสแกนซ้ำใน 1.5 วินาที
  if (decodedText === state.lastResult && (now - state.lastResultTime) < 1500) return;
  state.lastResult = decodedText;
  state.lastResultTime = now;

  // ✅ หยุดสแกนชั่วคราว — กันสแกนซ้ำ
  state.pendingResult = decodedText;

  // แสดง flash เขียว
  showSuccessFlash();

  // Beep + Haptic
  beep('success');
  haptic([50, 30, 50]);

  // หยุดกล้อง
  try {
    if (state.html5QrCode && state.isScanning) {
      state.html5QrCode.pause(true);
    }
  } catch(e) {}

  // แสดง popup ยืนยัน
  setTimeout(function() {
    showResultPopup(decodedText, decodedResult);
  }, 200);
}

function onScanError(err) {
  // ไม่ต้อง log — เกิดทุกเฟรมที่สแกนไม่ติด
}

/* ============================================================
   💬 Popup
============================================================ */
function showResultPopup(code, result) {
  document.getElementById('resultCode').textContent = code;

  var format = '';
  if (result && result.result && result.result.format) {
    format = result.result.format.formatName || '';
  }
  document.getElementById('resultInfo').textContent = format
    ? 'รูปแบบ: ' + format + ' · ตรวจสอบก่อนยืนยัน'
    : 'ตรวจสอบรหัสก่อนยืนยัน';

  document.getElementById('resultIcon').textContent = '✅';
  document.getElementById('resultTitle').textContent = 'สแกนสำเร็จ';
  document.getElementById('resultPopup').classList.remove('hidden');
}

function rescan() {
  state.pendingResult = '';
  document.getElementById('resultPopup').classList.add('hidden');

  setTimeout(function() {
    state.lastResult = '';
    state.lastResultTime = 0;
    try {
      if (state.html5QrCode) {
        state.html5QrCode.resume();
      }
    } catch(e) {}
  }, 300);
}

function confirmAndReturn() {
  if (!state.pendingResult) {
    toast('ไม่มีค่าที่สแกนได้', 'warn');
    return;
  }
  returnToApp(state.pendingResult);
}

/* ============================================================
   🚀 ส่งค่ากลับ
============================================================ */
function returnToApp(code) {
  if (!code) return;

  beep('success');
  haptic([50, 30, 50]);

  if (!config.returnUrl) {
    document.getElementById('resultCode').textContent = code;
    document.getElementById('resultInfo').textContent = 'กรุณาก็อปโค้ดด้านบนไปวางใน WMS';
    document.getElementById('resultIcon').textContent = '📋';
    document.getElementById('resultTitle').textContent = 'ก็อปโค้ดไปวาง';
    return;
  }

  var url = config.returnUrl;
  var sep = url.indexOf('?') === -1 ? '?' : '&';
  var finalUrl = url + sep + 'scanresult=' + encodeURIComponent(code) + '#scanresult=' + encodeURIComponent(code);

  document.getElementById('resultIcon').textContent = '🚀';
  document.getElementById('resultTitle').textContent = 'กำลังกลับไปที่ WMS...';

  // หยุดกล้องก่อนออก
  try {
    if (state.html5QrCode) {
      state.html5QrCode.stop().catch(function(){});
    }
  } catch(e) {}

  setTimeout(function() {
    try {
      window.location.href = finalUrl;
    } catch (e) {
      window.location.assign(finalUrl);
    }
  }, 400);
}

function closeAndReturn() {
  try {
    if (state.html5QrCode && state.isScanning) {
      state.html5QrCode.stop().catch(function(){});
    }
  } catch(e) {}

  if (config.returnUrl) {
    try {
      window.location.href = config.returnUrl;
    } catch (e) {
      window.history.back();
    }
  } else {
    window.close();
  }
}

/* ============================================================
   ⌨️ Manual
============================================================ */
function openManualInput() {
  document.getElementById('manualInput').value = '';
  document.getElementById('manualPopup').classList.remove('hidden');
  setTimeout(function() {
    document.getElementById('manualInput').focus();
  }, 200);
}

function closeManual() {
  document.getElementById('manualPopup').classList.add('hidden');
}

function submitManual() {
  var val = document.getElementById('manualInput').value.trim();
  if (!val) {
    toast('กรุณากรอกค่า', 'warn');
    return;
  }
  closeManual();
  state.pendingResult = val;
  returnToApp(val);
}

/* ============================================================
   🔆 Torch / Switch
============================================================ */
function toggleTorch() {
  if (!state.currentTrack) return;
  var caps = state.currentTrack.getCapabilities ? state.currentTrack.getCapabilities() : {};
  if (!caps || !caps.torch) {
    toast('อุปกรณ์ไม่รองรับไฟ', 'warn');
    return;
  }
  state.torchOn = !state.torchOn;
  state.currentTrack.applyConstraints({
    advanced: [{ torch: state.torchOn }]
  }).then(function() {
    document.getElementById('torchBtn').textContent = state.torchOn ? '🔅 ปิดไฟ' : '🔆 เปิดไฟ';
  }).catch(function() {
    toast('เปิดไฟไม่สำเร็จ', 'warn');
  });
}

function switchCamera() {
  if (state.devices.length < 2) return;

  // หยุดของเดิม
  state.html5QrCode.stop().then(function() {
    state.currentDeviceIndex = (state.currentDeviceIndex + 1) % state.devices.length;
    var device = state.devices[state.currentDeviceIndex];

    var scanConfig = {
      fps: 30,
      qrbox: function(w, h) {
        var minEdge = Math.min(w, h);
        var size = Math.floor(minEdge * 0.85);
        return { width: size, height: Math.floor(size * 0.65) };
      },
      aspectRatio: 1.0,
      experimentalFeatures: { useBarCodeDetectorIfSupported: true }
    };

    startScanning(device.id, scanConfig);
    toast('สลับกล้องแล้ว', 'info', 1500);
  }).catch(function(err) {
    console.error('Switch error:', err);
    toast('สลับกล้องไม่สำเร็จ', 'error');
  });
}

/* ============================================================
   🎨 Helper
============================================================ */
function showSuccessFlash() {
  var flash = document.createElement('div');
  flash.className = 'flash-success';
  document.querySelector('.scanner-viewport').appendChild(flash);
  setTimeout(function() { flash.remove(); }, 400);
}

function showError(msg, hint) {
  document.getElementById('loading').innerHTML =
    '<div style="padding:24px;text-align:center">' +
    '<div style="font-size:56px;margin-bottom:12px">🚫</div>' +
    '<div style="font-weight:900;font-size:16px;margin-bottom:8px">' + msg + '</div>' +
    '<div style="font-size:12px;color:rgba(255,255,255,.7);line-height:1.6;margin-bottom:20px">' + hint + '</div>' +
    '<button class="ctrl-btn primary" onclick="openManualInput()" ' +
    'style="width:100%;max-width:240px;margin:0 auto;padding:14px">' +
    '⌨️ กรอกเอง' +
    '</button>' +
    '</div>';
}

function toast(msg, type, duration) {
  type = type || 'info';
  duration = duration || 2500;
  var stack = document.getElementById('toastStack');
  var el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  stack.appendChild(el);
  setTimeout(function() {
    el.style.transition = 'opacity .3s, transform .3s';
    el.style.opacity = '0';
    el.style.transform = 'translateX(120%)';
    setTimeout(function() { el.remove(); }, 300);
  }, duration);
}

function haptic(p) { if (navigator.vibrate) navigator.vibrate(p || 10); }

function beep(type) {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = type === 'success' ? 1500 : 400;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    osc.start();
    osc.stop(ctx.currentTime + 0.15);
  } catch(e) {}
}

window.addEventListener('beforeunload', function() {
  try {
    if (state.html5QrCode && state.isScanning) {
      state.html5QrCode.stop().catch(function(){});
    }
  } catch(e) {}
});

document.addEventListener('DOMContentLoaded', function() {
  var mi = document.getElementById('manualInput');
  if (mi) {
    mi.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); submitManual(); }
    });
  }
});
</script>
